<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Өртөг гүйцэтгэлийн удирдлага — интерактив тест</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--muted:#94a3b8;--purple:#5548ee;--cyan:#38bdf8;--green:#10b981;--red:#f43f5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:14px/1.55 Inter,system-ui,"Segoe UI",Arial,sans-serif}.shell{max-width:1280px;margin:14px auto;padding:0 16px}
header{height:auto;min-height:74px;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}.topic-jump{display:flex;align-items:center;gap:9px;margin-left:auto;color:var(--muted);font-size:12px}.topic-jump select{max-width:310px;background:#111c30;color:#e2e8f0;border:1px solid #475569;border-radius:9px;padding:10px 12px}.badge{width:40px;height:40px;border-radius:12px;background:var(--purple);display:grid;place-items:center;font-size:19px;font-weight:900}.brand h1{font-size:16px;margin:0}.brand p{margin:1px 0 0;color:#818cf8;font-size:12px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.head-actions button{white-space:nowrap}
button,select{font:inherit}button{cursor:pointer;color:#dbeafe;background:#111c30;border:1px solid #334155;border-radius:10px;padding:10px 14px}button:hover{filter:brightness(1.18)}button:disabled{opacity:.35;cursor:not-allowed}.purple{background:var(--purple);border-color:var(--purple);font-weight:700}.toggle.on{border-color:#10b981;color:#34d399}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:0 16px 18px;border:1px solid var(--line);border-top:0;background:#111b2e;border-radius:0 0 14px 14px}
.left{min-width:0}.summary{margin-top:0;background:var(--panel);border:1px solid var(--line);border-radius:0 0 14px 14px;padding:17px 20px;display:grid;grid-template-columns:auto auto minmax(120px,1fr);align-items:center;gap:20px}
.metric{padding-right:18px;border-right:1px solid #334155}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:20px}.green{color:#34d399}.tracklabel{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.track{height:9px;background:#0b1425;border:1px solid #334155;border-radius:20px;overflow:hidden;margin-top:6px}.track i{display:block;height:100%;background:linear-gradient(90deg,#5548ee,#38bdf8);width:0}
.question-card{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 30px;min-height:570px}.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.qtag{border:1px solid #4f46e5;color:#818cf8;background:#24265a;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}.link{border:0;background:none;text-decoration:underline;color:#93c5fd;padding:4px}.qtitle{font-size:19px;line-height:1.55;margin:14px 0 22px}.options{display:grid;gap:12px}.answer-actions{display:flex;justify-content:flex-end;margin-top:18px}.answer-actions button{min-width:170px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#182438;border:1px solid #25364e;border-radius:12px;padding:15px 16px;min-height:58px}.option.selected{border-color:#818cf8;background:#28285b}.option.correct{border:2px solid #10b981!important;background:#064b43!important;color:#a7f3d0!important;box-shadow:inset 4px 0 0 #10b981}.option.incorrect{border:2px solid #f43f5e!important;background:#4b2336!important;color:#fecdd3!important;box-shadow:inset 4px 0 0 #f43f5e}.option.dim{opacity:.48}.letter{flex:0 0 25px;font-weight:800;color:#c4b5fd}.status{margin-left:auto;white-space:nowrap;font-weight:800}.hidden{display:none!important}.feedback{margin-top:18px;padding:14px 16px;border-radius:12px;border:1px solid}.feedback.good{background:#064b43;border-color:var(--green);color:#a7f3d0}.feedback.bad{background:#4b2336;border-color:#be3455;color:#fecdd3}.feedback b{display:block;margin-bottom:4px}.why{font-size:13px;line-height:1.65}.nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #334155;margin-top:22px;padding-top:20px}.navmid{color:var(--muted);font-size:12px}
.right{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-height:620px}.righttop{display:flex;justify-content:space-between;align-items:center}.righttop b{font-size:14px}.reset{color:#fb7185;border:0;background:none;padding:4px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0f172a;border:1px solid #334155;border-radius:12px;padding:4px;margin:14px 0 18px}.filters button{border:0;background:none;padding:8px 3px;font-size:11px;color:#9fb0c7}.filters button.active{background:var(--purple);color:white;border-radius:8px;font-weight:700}.gridnums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;max-height:420px;overflow:auto;padding:2px 4px 8px 0}.gridnums button{height:50px;padding:4px;background:#1e293b;border-color:#34445d}.gridnums button.current{border:1px solid #7067ff;color:white;background:#28285b}.gridnums button.correct{background:#064b43;border-color:#10b981;color:#a7f3d0}.gridnums button.wrong{background:#4b2336;border-color:#f43f5e;color:#fecdd3}.legend{border-top:1px solid #334155;margin-top:16px;padding-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:8px;color:#9fb0c7;font-size:11px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#64748b}.dot.g{background:#10b981}.dot.r{background:#f43f5e}.dot.p{background:#7067ff}

@media(max-width:950px){.layout{grid-template-columns:1fr}.right{min-height:auto;order:-1}.gridnums{max-height:180px}.question-card{padding:20px}.summary{grid-template-columns:auto auto 1fr}}
@media(max-width:600px){.topic-jump{margin-left:0;width:100%;flex-wrap:wrap}.topic-jump select{max-width:100%;width:100%}header{align-items:flex-start;flex-direction:column}.head-actions{width:100%}.head-actions button{flex:1;font-size:11px;padding:8px}.summary{grid-template-columns:1fr 1fr}.summary .progressbox{grid-column:1/-1}.metric{border:0}.layout{padding:0 9px 12px}.qtitle{font-size:17px}.status{font-size:11px}}

.reset-modal{position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.reset-modal.hidden{display:none!important}
.reset-dialog{width:min(420px,100%);background:#1e293b;border:1px solid #475569;border-radius:16px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.5);color:#e5edf8}
.reset-dialog h3{margin:0 0 10px;font-size:18px}
.reset-dialog p{margin:0 0 22px;color:#b8c6d9;line-height:1.6;font-size:14px}
.reset-actions{display:flex;justify-content:flex-end;gap:10px}
.reset-actions button{padding:10px 16px;border-radius:9px}
</style></head><body><div class="shell">
<header><div class="brand"><div class="badge">C1</div><div><h1 id="topicHeading"></h1><p id="topicSub"></p></div></div><div class="topic-jump"><label for="topicSelect">Сэдэв сонгох</label><select id="topicSelect" onchange="jumpTopic(this.value)"></select></div>
<div class="head-actions"><button id="revealBtn" class="toggle" onclick="toggleReveal()">⚡ Хариулт шууд харах: <b id="revealText">Унтраалттай</b></button><button class="purple" onclick="challenge()">✍️ Тест дасгал</button><button onclick="showKey()">🔑 Түлхүүр харах</button></div></header>
<div class="layout"><div class="left"><section class="summary"><div class="metric"><span>Давсан дасгал</span><strong id="answered">0 / 76</strong></div><div class="metric"><span>Оноо (Зөв хариулт)</span><strong class="green" id="score">0 / 0</strong></div><div class="progressbox"><div class="tracklabel"><span>Гүйцэтгэл</span><span id="progressPct">0%</span></div><div class="track"><i id="progressBar"></i></div></div></section>
<section class="question-card"><div class="qtop"><span class="qtag" id="qtag">ТЕСТ № 1</span><button class="link" onclick="revealOne()">Хариулт харах</button></div><h2 class="qtitle" id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="nav"><button id="prev" onclick="move(-1)">← Өмнөх</button><span class="navmid" id="navcount"></span><button class="purple" id="next" onclick="move(1)">Дараах / Эх рүү →</button></div></section></div>
<aside class="right"><div class="righttop"><b id="selectorTitle">ТЕСТ СОНГОГЧ (1–76)</b><button class="reset" onclick="resetTopic()">Шинэчлэх</button></div><div class="filters"><button class="active" data-filter="all" onclick="setFilter('all',this)">Бүгд</button><button data-filter="answered" onclick="setFilter('answered',this)">Хариулсан</button><button data-filter="open" onclick="setFilter('open',this)">Хариулаагүй</button><button data-filter="wrong" onclick="setFilter('wrong',this)">Буруу</button></div><div class="gridnums" id="gridnums"></div><div class="legend"><span><i class="dot g"></i>Зөв хариулсан</span><span><i class="dot r"></i>Буруу хариулсан</span><span><i class="dot p"></i>Одоогийн асуулт</span><span><i class="dot"></i>Хариулаагүй</span></div>
<div id="keyPanel" style="display:none;margin-top:16px;padding:14px;border:1px solid #475569;border-radius:12px;background:#111c30">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b id="keyHeading">Хариултын түлхүүр</b><button type="button" onclick="document.getElementById('keyPanel').style.display='none'" aria-label="Хаах" >✕ Хаах</button></div>
<div id="keyContent" style="margin-top:10px;max-height:220px;overflow:auto;color:#cbd5e1;font-size:12px;line-height:1.9"></div></div></aside></div></div>

<div id="resetModal" class="reset-modal hidden" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
  <div class="reset-dialog">
    <h3 id="resetTitle">Тестийг шинээр эхлүүлэх үү?</h3>
    <p id="resetMessage">Зөвхөн одоо сонгосон бүлэг сэдвийн хариулт, оноог цэвэрлэнэ. Бусад сэдвийн үр дүн хэвээр үлдэнэ.</p>
    <div class="reset-actions">
      <button type="button" onclick="cancelReset()">Болих</button>
      <button type="button" class="purple" onclick="confirmReset()">Тийм, цэвэрлэх</button>
    </div>
  </div>
</div>
<script>
const T=[{"number": 1, "title": "Өртөг тооцолт: шингээгч ба шууд өртгийн арга", "questions": [{"num": 1, "text": "Шууд зардлаар өртөг тооцох үед бүтээгдэхүүний өртөгт үйлдвэрлэлийн ба үйл ажиллагааны хувьсах зардал багтана.", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "B"}, {"num": 2, "text": "Шууд ба шингээгч өртгийн аргын гол ялгаа юу вэ?", "options": [{"letter": "A", "text": "Орлогын тайлангийн хэлбэр"}, {"letter": "B", "text": "ҮНЗ-ийн тогтмол зардлыг бүртгэх"}, {"letter": "C", "text": "Ахиуц ашгийн тооцоолол"}, {"letter": "D", "text": "Зөв хариулт алга"}], "answer": "B"}, {"num": 3, "text": "Шууд зардлаар тооцсон өртөг гэдэг нь бүтээгдэхүүнийг зөвхөн үйлдвэрлэсэн үед гарах үйлдвэрлэлийн өртөг юм.", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "A"}, {"num": 4, "text": "Үйлдвэрлэлийн нэмэгдэл зардлын нормыг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Тооцсон ҮНЗ/Төсөвлөсөн суурь"}, {"letter": "B", "text": "Гүйцэтгэлээрх ҮНЗ/ Бодит суурь"}, {"letter": "C", "text": "Төсөвлөсөн ҮНЗ/Стандарт суурь"}, {"letter": "D", "text": "Төсөвлөсөн ҮНЗ/Төсөвлөсөн суурь"}], "answer": "D"}, {"num": 5, "text": "Бодит суурь >Төсөвлөсөн суурь үед", "options": [{"letter": "A", "text": "Тооцсон ҮНЗ>Төсөвлөсөн ҮНЗ"}, {"letter": "B", "text": "Тооцсон ҮНЗ<Төсөвлөсөн ҮНЗ"}, {"letter": "C", "text": "Тооцсон ҮНЗ=Төсөвлөсөн ҮНЗ"}, {"letter": "D", "text": "Бодит ҮНЗ<Тооцсон ҮНЗ"}], "answer": "A"}, {"num": 6, "text": "Хэрэв бодит ҮНЗ нь тооцсон ҮНЗ-аас их үед ямар зөрүү үүсэх вэ?", "options": [{"letter": "A", "text": "Илүү тооцсон ҮНЗ"}, {"letter": "B", "text": "Дутуу тооцсон ҮНЗ"}, {"letter": "C", "text": "Зөрүү үүсэхгүй"}, {"letter": "D", "text": "А ба С"}], "answer": "B"}, {"num": 7, "text": "Аль нь буруу вэ?", "options": [{"letter": "A", "text": "Урт хугацаанд үйлдвэрлэсэн бүтээгдэхүүн = Борлуулсан бүтээгдэхүүн байх тул Цэвэр ашиг = Цэвэр ашиг байна."}, {"letter": "B", "text": "Богино хугацаанд шингээгч ба шууд зардлаар тооцсон цэвэр ашиг зөрүүтэй байна."}, {"letter": "C", "text": "Ямагт шингээгч зардлаар тооцсон цэвэр ашиг нь шууд аргаар тооцсон цэвэр ашгаас их байна."}, {"letter": "D", "text": "С ба А"}], "answer": "C"}, {"num": 8, "text": "А компани тайлант хугацаанд 60ш бүтээгдэхүүн агуулахад бэлэн байсан ба 150ш бүтээгдэхүүн үйлдвэрлэж 180 ширхгийг борлуулсан бол шууд зардлаар тооцсон ашиг нь шингээгч өртгөөр тооцсон ашгаас ямар байх вэ?", "options": [{"letter": "A", "text": "Их байна."}, {"letter": "B", "text": "Бага байна."}], "answer": "A"}, {"num": 9, "text": "Өртгийг хуримтлуулан бүртгэж буй бүтээгдэхүүн, ажил үйлчилгээ, нэгжүүдэд бүрэн хуваарилагдах боломжтой зардлыг . . . . . гэнэ.", "options": [{"letter": "A", "text": "Шууд бус зардал"}, {"letter": "B", "text": "Шууд зардал"}, {"letter": "C", "text": "Үйлдвэрлэлийн нэмэгдэл зардал"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "B"}, {"num": 10, "text": "Үйлдвэрлэлийн нэмэгдэл зардлын түвшнийг дараах байдлаар тодорхойлдог.", "options": [{"letter": "A", "text": "Тооцсон үйлдвэрлэлийн нэмэгдэл зардал/төсөвлөсөн суурь"}, {"letter": "B", "text": "Бодит үйлдвэрлэлийн нэмэгдэл зардал/бодит суурь"}, {"letter": "C", "text": "Төсөвлөсөн үйлдвэрлэлийн нэмэгдэл зардал/төсөвлөсөн суурь"}, {"letter": "D", "text": "Тооцсон үйлдвэрлэлийн нэмэгдэл зардал/бодит суурь"}], "answer": "C"}, {"num": 11, "text": "Бүтээгдэхүүний нэгжийн өртгийг тооцохдоо зөвхөн хувьсах зардлаар тооцдог арга нь:", "options": [{"letter": "A", "text": "Шингээх өртөг тооцолтын арга"}, {"letter": "B", "text": "Шууд өртөг тооцолтын арга"}, {"letter": "C", "text": "Үйлдэлд суурилсан арга"}, {"letter": "D", "text": "Уламжлалт арга"}], "answer": "B"}, {"num": 12, "text": "Дараахаас аль нь үйлдвэрлэлийн өртөг вэ?", "options": [{"letter": "A", "text": "Шууд зардал + гүйцэтгэлээрх үйлдвэрлэлийн нэмэгдэл зардал"}, {"letter": "B", "text": "Шууд материалын зардал + шууд хөдөлмөрийн зардал + илүү, дутуу тооцсон үйлдвэрлэлийн нэмэгдэл з ext": "Зорилтот өртгийн хандлагын үед дараахаас аль нь зөв бэ?", "options": [{"letter": "A", "text": "Хамгийн түрүүнд зорилтот өртгийг тооцож түүн дээр зорилтот ашгийг нэмснээр зорилтот борлуулалтын үнийг тодорхойлно."}, {"letter": "B", "text": "Үйлдэл буюу өртгийн төв бүрийн зардлыг харгалзах зардлын хөтлөгчид харьцуулах байдлаар ҮНЗ-ын нормыг үйлдэл тус бүрээр тооцно."}, {"letter": "C", "text": "Тооцоолсон өртгийг тооцож зорилтот борлуулалтын үнээс хасах байдлаар зорилтот өртгийн зөрүүг тооцдог."}, {"letter": "D", "text": "Хамгийн түрүүнд зорилтот борлуулалтын үнийг тооцож түүнээс шаардагдах ашгийг хассанаар зорилтот өртгийг тооцно."}], "answer": "D"}, {"num": 13, "text": "Зорилтот өртгийн зөрүүг арилгах арга замуудаас зөвийг сонго. і. Бүрэлдэхүүн хэсгийн тоог багасгах іі. Үнэ цэнэ нэмдэггүй зүйлсийг хасах ііі. Өөр төрлийн бүтээгдэхүүн үйлдвэрлэх іv. Стандарт бүрэлдэхүүн хэсгүүдийг ашиглах v. Шинэ, илүү үр ашигтай маркетинг явуулах", "options": [{"letter": "A", "text": "і, іі, ііі, іv"}, {"letter": "B", "text": "і, іі, v"}, {"letter": "C", "text": "іі, іv, v"}, {"letter": "D", "text": "і, іі, іv"}], "answer": "D"}, {"num": 14, "text": "Зорилтот өртгийг бүтээгдэхүүний амьдралын мөчлөгийн аль үе шатанд нэвтрүүлбэл хамгийн их үр дүнтэй вэ?", "options": [{"letter": "A", "text": "Судалгаа хөгжүүлэлт"}, {"letter": "B", "text": "Нэвтрэлтийн үе шат"}, {"letter": "C", "text": "Өсөлтийн үе шат"}, {"letter": "D", "text": "Тогтворжилтын үе шат"}], "answer": "A"}, {"num": 15, "text": "Зорилтот өртөг нь одоогийн үйлдвэрлэлийн өртгөөс ямагт их байдаг.", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "B"}, {"num": 16, "text": "Зорилтот өртгийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Борлуулалтын үнэ – Зорилтот ашиг"}, {"letter": "B", "text": "Зорилтот ашиг + Гүйцэтгэлээр өртөг"}, {"letter": "C", "text": "Тооцоолсон өртөг – Зорилтот ашиг"}, {"letter": "D", "text": "Борлуулалтын үнэ – Зорилтот өртгийн зөрүү"}], "answer": "A"}, {"num": 17, "text": "Зорилтот ашгийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Бүрэн шингээлтээр тооцсон нэгжийн өртөгт үндэслэн тооцно."}, {"letter": "B", "text": "Шууд зардлаар тооцсон нэгжийн өртөгт үндэслэн тооцно."}, {"letter": "C", "text": "Хөрөнгө оруулалтын өгөөжид үндэслэн тооцно."}, {"letter": "D", "text": "Амьдралын мөчлөгийн өртөгт үндэслэн тооцно."}], "answer": "C"}, {"num": 18, "text": "Зорилтот өртгийн зөрүүг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Тооцоолсон өртөг – Зорилтот өртөг"}, {"letter": "B", "text": "Гүйцэтгэлээрх өртөг – Тооцоолсон өртөг"}, {"letter": "C", "text": "Тооцоолсон өртөг – Гүйцэтгэлээрх өртөг"}, {"letter": "D", "text": "Зорилтот өртөг – Гүйцэтгэлээрх өртөг"}], "answer": "A"}, {"num": 19, "text": "Үйлчилгээний салбарт зорилтот өртөг тооцох хандлагыг ашиглахад хүндрэлтэй болгодог шинж чанаруудыг нэрлэнэ үү?", "options": [{"letter": "A", "text": "Богино хугацаат байдал, хувирамтгай байдал"}, {"letter": "B", "text": "Хувьсамтгай байдал, биет бус байдал"}, {"letter": "C", "text": "Биет бус байдал, салшгүй байдал"}, {"letter": "D", "text": "Салшгүй байдал, богино хугацаат байдал"}], "answer": "B"}, {"num": 20, "text": "Бүтээгдэхүүн үйлчилгээг чанар ба найдвартай ажиллагааны стандартыг хангахын зэрэгцээ хамгийн хямд өртгөөр үйлдвэрлэх үндсэн зорилгодоо хүрэхийн тулд түүний өртөгт нөлөөлж буй хүчин зүйлсийг судлах үйл явцыг .................... гэнэ.", "options": [{"letter": "A", "text": "Үнэ цэнийн шинжилгээ"}, {"letter": "B", "text": "Өртгийн шинжилгээ"}, {"letter": "C", "text": "Чанарын шинжилгээ"}, {"letter": "D", "text": "Найдвартай байдлын шинжилгээ"}], "answer": "A"}, {"num": 21, "text": "Үйлчилгээ үзүүлэх бүрт түүний үр дүн харилцан адилгүй байдаг нь түүний .................... шинж чанартай холбоотой.", "options": [{"letter": "A", "text": "Биет бус байдал"}, {"letter": "B", "text": "Тогтвортой байдал"}, {"letter": "C", "text": "Хувьсамтгай байдал"}, {"letter": "D", "text": "Тодорхойгүй байдал"}], "answer": "C"}, {"num": 22, "text": "Зорилтот өртөг гэдэг нь:", "options": [{"letter": "A", "text": "Зорилтот борлуулалтын орлогоос зорилтот ашгийг хассан дүн юм."}, {"letter": "B", "text": "Зорилтот борлуулалтын орлогоос гүйцэтгэлээрх өртгийг хассан дүн юм."}, {"letter": "C", "text": "Гүйцэтгэлээрх өртгөөс төсөвлөсөн өртгийг хассан дүн юм."}, {"letter": "D", "text": "Зорилтот ашгаас гүйцэтгэлээрх ашгийг хассан дүн юм."}], "answer": "A"}, {"num": 23, "text": "Дараах үйл явц нь зорилтот өртөг тооцох аргын алхамууд. Зөв дараалалд оруулна уу. (1) Зорилтот өртгөө тооцно, (2) Бүтээгдэхүүн үйлдвэрлэлийн одоогийн өртөг тооцоолно, (3) Шаардлагатай ашгийг тооцно, (4) Борлуулалтын үнээ шийдвэрлэнэ, (5) Зорилтот өртгийн зөрүүг тооцно.", "options": [{"letter": "A", "text": "(2), (3), (4), (1), (5)"}, {"letter": "B", "text": "(1), (2), (3), (4), (5)"}, {"letter": "C", "text": "(4), (3), (1), (2), (5)"}, {"letter": "D", "text": "(4), (5), (3), (1), (2)"}], "answer": "C"}, {"num": 24, "text": "Зорилтот өртөг = Зорилтот үнэ - .........", "options": [{"letter": "A", "text": "Төсөвлөсөн (шаардлагатай) ашиг"}, {"letter": "B", "text": "Үйлдвэрлэлийн өртөг"}, {"letter": "C", "text": "Үйл ажиллагааны зардал"}, {"letter": "D", "text": "Хөрөнгө оруулалтын өгөөж"}], "answer": "A"}, {"num": 25, "text": "Үйлчилгээний салбар дахь зорилтот өртөгтэй холбоотой буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Үйлчилгээ нь биет бус шинж чанартай байдаг."}, {"letter": "B", "text": "Үйлчилгээ нь хүргэлтийн цэг дээр ямар нэгэн биет зүйл шилжүүлдэггүй."}, {"letter": "C", "text": "Үйлчилгээ үзүүлсний үр дүнд заавал өмчлөл шилждэг."}, {"letter": "D", "text": "Үйлчилгээ нь ихэвчлэн богино хугацаатай байдаг."}], "answer": "C"}, {"num": 26, "text": "Зорилтот өртгийн зөрүүг арилгахтай холбоотой буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Борлуулалтын үнийг өсгөх замаар зорилтот өртгийн зөрүүг арилгаж болохгүй."}, {"letter": "B", "text": "Хэрэв тодорхой нэг бүрэлдэхүүн хэсгийн өртгийг зорилтот өртөг хүртэл нь багасгаж чадахааргүй байвал өөр нэг бүрэлдэхүүн хэсгийн зорилтот өртгийг бууруулна."}, {"letter": "C", "text": "Хэрэв тодорхой нэг бүрэлдэхүүн хэсгийн өртгийг зорилтот өртөг хүртэл нь багасгаж чадахааргүй байвал өөр нэг бүрэлдэхүүн хэсгийн бүтээгдэхүүнийг дахин загварчилна эсвэл үйлдвэрлэхээ болих шаардлагатай."}, {"letter": "D", "text": "Борлуулалтын үнийг өсгөх замаар зорилтот өртгийн зөрүүг арилгаж болно."}], "answer": "D"}, {"num": 27, "text": "Хэрэв “зорилтот өртөг < төсөвлөсөн өртөг” бол дараах дүгнэлтийг хийх боломжтой.", "options": [{"letter": "A", "text": "Одоогийн бүтээгдэхүүнийг зах зээлд борлуулах нь ашигтай"}, {"letter": "B", "text": "Шинэ бүтээгдэхүүнийг зах зээлд нэвтрүүлэх боломжтой"}, {"letter": "C", "text": "Одоогийн бүтээгдэхүүний өртгийг бууруулах шаардлагагүй"}, {"letter": "D", "text": "Шинэ бүтээгдэхүүний өртгийг бууруулах шаардлагатай"}], "answer": "D"}, {"num": 28, "text": "Зорилтот өртөг тооцох хандлагатай холбоотой ойлголтуудаас бурууг сонгоно уу.", "options": [{"letter": "A", "text": "Хөрөнгө оруулалтын өгөөжид үндэслэн шаардлагатай ашгийг тооцно."}, {"letter": "B", "text": "Шинэ бүтээгдэхүүнийг анх төсөвлөх үед түүний тооцоолсон өртөг ихэнх тохиолдолд зорилтот өртгөөс бага байдаг."}, {"letter": "C", "text": "Зорилтот өртөг гэдэг нь яг нарийвчилсан техник үзүүлэлтийн өртөг юм."}, {"letter": "D", "text": "Төгс өрсөлдөөнт зах зээлийн үед компаниуд зорилтот өртөг тооцолтоос өгөөж хүртэх боломжтой юм."}], "answer": "B"}, {"num": 29, "text": "Зорилтот өртөг тооцох хандлагыг нэвтрүүлэхэд хамгийн чухал эхний алхам бол . . . . . . . . болно.", "options": [{"letter": "A", "text": "зорилтот өртгийн зөрүүг тооцоолох"}, {"letter": "B", "text": "зорилтот борлуулалтын үнийг тооцох"}, {"letter": "C", "text": "анхны загварын төлөвлөгөө болон одоогийн өртөг зардлын мэдээлэлд үндэслэн бүтээгдэхүүний тооцоолсон өртгийг тодорхойлох"}, {"letter": "D", "text": "бүтээгдэхүүний үйлдвэрлэл, борлуулалтын төлөвлөгөө хийх болно."}], "answer": "D"}, {"num": 38, "text": "А компани шинээр зах зээлд нэвтрүүлэх хүүхдийн амин дэмийн өртгийг зорилтот өртөг тооцох хандлагаар тооцох болсон. Тус компани бүтээгдэхүүнд ашиглагдах материал, сэлбэг, өртгийг бууруулах зэрэг судалгааг явуулж байгаа нь дараах аргуудын алинд нь хамаарах вэ?", "options": [{"letter": "A", "text": "Чиг үүргийн шинжилгээний арга"}, {"letter": "B", "text": "Техник үнэлгээний арга"}, {"letter": "C", "text": "Чиг үүргийн шинжилгээний арга болон техник үнэлгээний арга"}, {"letter": "D", "text": "Тооцох боломжгүй"}], "answer": "B"}, {"num": 39, "text": "Үйлчилгээний бизнесийн шинж чанар, мэдээллийн шаардлага зэргээс шалтгаалан үйлчилгээний салбарт зорилтот өртөг тооцолтыг ашиглахад хүндрэлтэй байдаг. Дараахаас аль нь үйлчилгээний байгууллагын онцлог шинж биш вэ?", "options": [{"letter": "A", "text": "Биет бус байдал"}, {"letter": "B", "text": "Салшгүй байдал"}, {"letter": "C", "text": "Өмчлөл үл шилжих байдал"}, {"letter": "D", "text": "Нэг төрлийн байдал"}], "answer": "D"}]}, {"number": 4, "title": "Амьдралын мөчлөгийн өртөг тооцох арга", "questions": [{"num": 1, "text": "Бүтээгдэхүүн үйлдвэрлэхтэй холбогдон дараах өртгүүд бий болсон: (i) Төлөвлөлт болон загварчлахтай холбоотой өртөг (ii) Туршилтын өртөг (iii) Үйлдвэрлэлийн өртөг (iv) Түгээлт болон хэрэглэгчийн үйлчилгээний өртөг Бүтээгдэхүүний амьдралын мөчлөгийн өртгийг тооцоход дээрхээс алийг нь оруулах вэ?", "options": [{"letter": "A", "text": "Зөвхөн (iii)"}, {"letter": "B", "text": "Зөвхөн (i), (ii) болон (iii)"}, {"letter": "C", "text": "Зөвхөн (i), (ii) болон (iv)"}, {"letter": "D", "text": "Дээрх бүгд"}], "answer": "D"}, {"num": 2, "text": "Амьдралын мөчлөгийн өртөг тооцох дараах ойлголтуудаас аль нь үнэн бэ? i. Бүтээгдэхүүний амьдралын мөчлөгийн эхний үеийн өртгийг тодорхойлсноор богино хугацаанд анхаарал хандуулдаг. ii. Жил бүр бүтээгдэхүүнтэй холбоотой гарах бүх өртгийг тодорхойлох ба улмаар бүтээгдэхүүний ашигт байдлыг жил бүрийн сууриар тооцдог. iii. Бүтээгдэхүүний бүхий л амьдралынх нь хугацааны өртгийг хуримтлуулдаг ба бүтээгдэхүүний ерөнхий ашигт байдлыг тооцдог. iv. Өртгийг бүтээгдэхүүний амьдралын мөчлөгийн үе шат бүрд хуваарилах ба тухайн үе шатны эцэст данснаас хасдаг.", "options": [{"letter": "A", "text": "Зөвхөн (i) болон (iii)"}, {"letter": "B", "text": "Зөвхөн (iii)"}, {"letter": "C", "text": "(i) болон (iv)"}, {"letter": "D", "text": "Зөвхөн (ii)"}], "answer": "B"}, {"num": 3, "text": "Багц бүтээгдэхүүний амьдралын мөчлөгийн өртгийг дараах үе шатны алинд тодорхойлох вэ?", "options": [{"letter": "A", "text": "Загвар зохиох болон хөгжүүлэх шатанд"}, {"letter": "B", "text": "Зах зээлд шинээр нэвтэрсэн үед"}, {"letter": "C", "text": "Өсөлтийн шатанд"}, {"letter": "D", "text": "Зах зээлээс шахагдан гарах үед"}], "answer": "A"}, {"num": 4, "text": "Амьдралын мөчлөгийн өртөг тооцолтын үед дараахаас аль нь зөв бэ? (i) Бүтээгдэхүүний амьдралын мөчлөгийн өсөлтийн үед борлуулалт дээд цэгтээ хүрдэг бөгөөд энэ үед хамгийн их ашигтай ажилладаг. (ii) Бүтээгдэхүүний амьдралын мөчлөгийн уналтын үед бүтээгдэхүүн ямар ч эрэлтгүй болсон байдаг ба энэ үед уг бүтээгдэхүүний үйлдвэрлэлийг зогсоох шаардлагатай.", "options": [{"letter": "A", "text": "Зөвхөн і"}, {"letter": "B", "text": "Зөвхөн іі"}, {"letter": "C", "text": "Аль нь ч биш"}, {"letter": "D", "text": "і ба іі"}], "answer": "C"}, {"num": 5, "text": "Дараахаас аль нь бүтээгдэхүүний амьдралын мөчлөгийн турш санхүүгийн өгөөжийг сайжруулах арга зам бэ? (i) Алдагдал нөхөх хугацааг ихэсгэх (ii) Зах зээлд гаргах хугацааг багасгах (iii) Амьдралын мөчлөгийг нь багасгах", "options": [{"letter": "A", "text": "i ба ii"}, {"letter": "B", "text": "i ба iii"}, {"letter": "C", "text": "ii"}, {"letter": "D", "text": "ii ба iii"}], "answer": "C"}, {"num": 6, "text": "А компанийн шинээр үйлдвэрлэх гэж буй бүтээгдэхүүний анхны загварыг бүтээхэд 290,000₮-ийн зардал гарсан бол энэ нь дараах зардлуудын аль төрөлд хамаарах вэ?", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн зардал"}, {"letter": "B", "text": "Борлуулалтын зардал"}, {"letter": "C", "text": "Сургалтын зардал"}, {"letter": "D", "text": "Судалгаа хөгжүүлэлтийн зардал"}], "answer": "D"}, {"num": 7, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн өртөг тооцох системтэй холбоотой буруу хариултыг сонго.", "options": [{"letter": "A", "text": "Бүтээгдэхүүний өртгийн ихэнх хувь нь амьдралын мөчлөгийн эхэн үед тодорхойлогддог."}, {"letter": "B", "text": "Бүтээгдэхүүн үйлчилгээний өртгийг тухайн тайлант хугацаа бүрээр тооцдог."}, {"letter": "C", "text": "Бүтээгдэхүүнийг хөгжүүлэх эсвэл үйлдвэрлэлийг цаашид үргэлжлүүлэх эсэх талаар ямар нэг шийдвэр гаргахад удирдлагад тусалдаг."}, {"letter": "D", "text": "Бүтээгдэхүүний загварыг зохиох хөгжүүлэхээс эхлээд зах зээлд гаргах, зах зээлээс татах хүртэлх амьдралын мөчлөгийн хугацаанд уг бүтээгдэхүүний ашигт байдлыг тодорхойлдог."}], "answer": "B"}, {"num": 8, "text": "Үйлчилгээ нь тодорхой амьдралын мөчлөгтэй байдаг. Гэхдээ бүтээгдэхүүний амьдралын мөчлөгөөс ялгаатай нь судалгаа хөгжлийн үе шатууд нь үйлчилгээний салбарт байдаггүй. Энэ нь ....................................", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "A"}, {"num": 9, "text": "Амьдралын мөчлөгийн өртөг тооцох системийн үед дараах шинж чанар үүсэх үе шатыг сонгоно уу. “Бүтээгдэхүүнээс ашиг олохын тулд томоохон зах зээлийг байгуулах шаардлагатай ба борлуулалтын орлогын өсөлт бий болсноор бүтээгдэхүүнээс ашиг олж эхэлдэг”", "options": [{"letter": "A", "text": "Нэвтрэлтийн үе"}, {"letter": "B", "text": "Уналтын үе"}, {"letter": "C", "text": "Тогтворжилтын үе"}, {"letter": "D", "text": "Өсөлтийн үе"}], "answer": "D"}, {"num": 10, "text": "Бүтээгдэхүүний өртгийн хэдэн хувь нь амьдралын мөчлөгийн эхэн үед тодорхойлогддог вэ?", "options": [{"letter": "A", "text": "50-60%"}, {"letter": "B", "text": "80-90%"}, {"letter": "C", "text": "90-100%"}, {"letter": "D", "text": "70-80%"}], "answer": "D"}, {"num": 11, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн аль үе шатанд байгууллагад үнийн сонголт харьцангуй их байдаг вэ?", "options": [{"letter": "A", "text": "Эхлэлтийн үе шат"}, {"letter": "B", "text": "Тогтворжилтын үе шат"}, {"letter": "C", "text": "Өсөлтийн үе шат"}, {"letter": "D", "text": "Уналтын үе шат"}], "answer": "A"}, {"num": 12, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн өртөг тооцох аргын үед бурууг сонгоно уу.", "options": [{"letter": "A", "text": "Нэвтрэлтийн үе шатны төгсгөлд бүтээгдэхүүн алдагдлаа нөхөж дуусдаг."}, {"letter": "B", "text": "Өсөлтийн үе шатны төгсгөлд ашиг хамгийн их байдаг."}, {"letter": "C", "text": "Уналтын үе шатанд бүтээгдэхүүн хамгийн өндөр алдагдалтай байдаг."}, {"letter": "D", "text": "В ба С"}], "answer": "D"}, {"num": 13, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн аль үе шатанд хамгийн их зардал гардаг вэ?", "options": [{"letter": "A", "text": "Судалгаа, хөгжүүлэлтийн үе"}, {"letter": "B", "text": "Нэвтрэлтийн үе"}, {"letter": "C", "text": "Өсөлтийн үе"}, {"letter": "D", "text": "Тогтворжилтын үе"}], "answer": "A"}, {"num": 14, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн өртөгт дараах зардлуудыг авч үзнэ. (зөв хариултыг сонго)", "options": [{"letter": "A", "text": "Бүтээгдэхүүний амьдралын мөчлөгийн турш дахь үйлдвэрлэлийн үндсэн зардлыг оруулна."}, {"letter": "B", "text": "Бүтээгдэхүүний амьдралын мөчлөгийн турш дахь үйлдвэрлэлийн хувиргалтын зардлыг оруулна."}, {"letter": "C", "text": "Бүтээгдэхүүний амьдралын мөчлөгийн турш дахь үйлдвэрлэлийн зардлыг оруулна."}, {"letter": "D", "text": "Бүтээгдэхүүний амьдралын мөчлөгийн турш дахь тухайн бүтээгдэхүүнтэй холбоотой бүхий л зардлыг оруулна."}], "answer": "D"}, {"num": 15, "text": "Бүтээгдэхүүн амьдралын мөчлөгийнхөө аль үе шатанд хамгийн их ашиг бий болгодог вэ?", "options": [{"letter": "A", "text": "Судалгаа, хөгжүүлэлтийн үе"}, {"letter": "B", "text": "Нэвтрэлтийн үе"}, {"letter": "C", "text": "Өсөлтийн үе"}, {"letter": "D", "text": "Тогтворжилтын үе"}], "answer": "D"}, {"num": 16, "text": "Амьдралын мөчлөгийн өртөг тооцохтой холбоотой зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Бүтээгдэхүүн нь өсөлтийн үе шатандаа хамгийн их ашиг бий болгодог."}, {"letter": "B", "text": "Амьдралын мөчлөгийн өртөг бүрдүүлэгч зардлууд нь тогтмол зардлууд байдаг."}, {"letter": "C", "text": "Амьдралын мөчлөгийн өртөг гэдэг нь тухайн бүтээгдэхүүний үйлдвэрлэлийн зардал юм."}, {"letter": "D", "text": "Нэвтрэлтийн үе шатнаас эхэлж бүтээгдэхүүн үйлдвэрлэлийн хэмжээ өсдөг."}], "answer": "D"}, {"num": 17, "text": "Дараахаас аль нь бүтээгдэхүүний амьдралын мөчлөгийн хугацаатай шууд хамааралтай вэ?", "options": [{"letter": "A", "text": "Бүтээгдэхүүний тоо хэмжээ"}, {"letter": "B", "text": "Бүтээгдэхүүний нэгжийн өртөг"}, {"letter": "C", "text": "Бүтээгдэхүүний материал"}, {"letter": "D", "text": "Бүтээгдэхүүн үйлдвэрлэлийн зардал"}], "answer": "C"}, {"num": 18, "text": "Бүтээгдэхүүн амьдралын мөчлөгийн аль үе шатандаа орлого бий болгодоггүй вэ?", "options": [{"letter": "A", "text": "Судалгаа, хөгжүүлэлтийн үе"}, {"letter": "B", "text": "Нэвтрэлтийн үе"}, {"letter": "C", "text": "Тогтворжилтын үе"}, {"letter": "D", "text": "Уналтын үе"}], "answer": "A"}, {"num": 19, "text": "Бүтээгдэхүүний загварыг .................... үе шатанд хийнэ.", "options": [{"letter": "A", "text": "Судалгаа хөгжүүлэлтийн үе"}, {"letter": "B", "text": "Нэвтрэлтийн үе"}, {"letter": "C", "text": "Тогтворжилтын үе"}, {"letter": "D", "text": "Өсөлтийн үе"}], "answer": "A"}, {"num": 20, "text": "Дараахаас аль нь амьдралын мөчлөгийн өгөөжийг хамгийн их байлгах арга зам биш вэ?", "options": [{"letter": "A", "text": "Зах зээлд нэвтрэх хугацааг багасгах"}, {"letter": "B", "text": "Хугарлын цэг дээрх хугацааг уртасгах"}, {"letter": "C", "text": "Бүтээгдэхүүний амьдрах хугацааг уртасгах"}, {"letter": "D", "text": "Бүтээгдэхүүний загварыг үнэн зөв тодорхойлох"}], "answer": "B"}, {"num": 21, "text": "Дараахаас аль нь бүтээгдэхүүний амьдралын мөчлөгийн хугацаанд тогтмол гардаггүй зардал вэ?", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн зардал"}, {"letter": "B", "text": "Сав баглаа боодлын зардал"}, {"letter": "C", "text": "Зар сурталчилгааны зардал"}, {"letter": "D", "text": "Загвар, дизайн зохион бүтээх зардал"}], "answer": "D"}, {"num": 22, "text": "Дараах илэрхийллүүд нь амьдралын мөчлөгөөр өртөг тооцохтой холбоотой. 1. Энэ нь урт хугацааг авч үзэн, ба бүтээгдэхүүний амьдралын мөчлөгийн турш дахь өртгийг тодорхойлдог. 2. Энэ нь бүтээгдэхүүн үйлдвэрлэлтэй холбоотой жил бүрийн өртөг, ашиг зэргийг тодорхойлдог. 3. Энэ нь бүтээгдэхүүний амьдралын үе шат бүр дээр өртөг хуваарилах ба үе шат бүрийн төгсгөлд өртгийг тодорхойлдог.", "options": [{"letter": "A", "text": "1 ба 2 илэрхийлэл зөв"}, {"letter": "B", "text": "2 ба 3 илэрхийлэл зөв"}, {"letter": "C", "text": "Зөвхөн 1 илэрхийлэл зөв"}, {"letter": "D", "text": "Зөвхөн 2-р илэрхийлэл зөв"}], "answer": "C"}, {"num": 23, "text": "Бүтээгдэхүүний амьдралын мөчлөгтэй холбоотой дараах ойлголтууд өгөгдсөн. I). Хөгжүүлэлтийн үе шатанд судалгаа хийх, хөрөнгө оруулалт судлах, бүтээгдэхүүнийг таниулах зэрэг бэлтгэл ажлууд хийгдэнэ. II). Амьдралын мөчлөгийн өртгийг тооцохдоо тухайн бүтээгдэхүүний хүлээгдэж буй амьдралын мөчлөгийн турш гарах зардал, орох орлогыг тооцдог. III). Бүтээгдэхүүний анхны санаа төрж, загварыг зохион бүтээхээс эхлээд зах зээлээс татах хүртэл гарах бүх зардлыг амьдралын мөчлөгийн зардалд хамааруулна.", "options": [{"letter": "A", "text": "І, ІІ, ІІІ зөв"}, {"letter": "B", "text": "І буруу II, III зөв"}, {"letter": "C", "text": "І, ІІ буруу III зөв"}, {"letter": "D", "text": "I, III зөв ІІ буруу"}], "answer": "B"}, {"num": 24, "text": "Амьдралын мөчлөгийн өртөг тооцохтой холбоотой зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Амьдралын мөчлөгийн өртөг бүрдүүлэгч зардлууд нь тогтмол зардлууд байдаг."}, {"letter": "B", "text": "Амьдралын мөчлөгийн өртөг бүрдүүлэгч зардлууд нь зөвхөн хувьсах зардлууд байдаг."}, {"letter": "C", "text": "Судалгаа хөгжүүлэлтийн үе шатаас эхлэн бүтээгдэхүүнийг зах зээлээс гаргах хүртэлх бүхий л хугацааг бүтээгдэхүүний амьдралын мөчлөг гэнэ."}, {"letter": "D", "text": "Амьдралын мөчлөг нь бүтээгдэхүүнийг үйлдвэрлэхээс эхлээд борлуулах хүртэлх хугацааг хамарна."}], "answer": "C"}, {"num": 25, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн тогтворжилтын үед:", "options": [{"letter": "A", "text": "Бүтээгдэхүүний эрэлт дээд цэгтээ хүрч аажмаар буурдаг"}, {"letter": "B", "text": "Бүтээгдэхүүний эрэлт өсөж зах зээлд тодорхой байр суурь эзэлдэг"}, {"letter": "C", "text": "Бүтээгдэхүүнийг зах зээлд таниулдаг"}, {"letter": "D", "text": "Бүтээгдэхүүний сэтгэл ханамж хангалттай хийгдсэн байна"}], "answer": "A"}, {"num": 26, "text": "Уул уурхайн бүтээгдэхүүн үйлдвэрлэхтэй холбоотой дараах зардал гарсан. (i) Хайгуулын зардал (ii) Туршилтын зардал (iii) Олборлолтын зардал (iv) Нөхөн сэргээлтийн үйлчилгээний зардал Бүтээгдэхүүний амьдралын мөчлөгийн зардлыг тооцохдоо дээрх зүйлсийн алийг нь оруулах вэ?", "options": [{"letter": "A", "text": "(iii) зөвхөн"}, {"letter": "B", "text": "(i), (ii) ба (iii)"}, {"letter": "C", "text": "(i), (ii) ба (iv)"}, {"letter": "D", "text": "(i), (ii), (iii) ба (iv)"}], "answer": "D"}, {"num": 27, "text": "Бүтээгдэхүүн, үйлчилгээг зогсоох өртөг нь амьдралын мөчлөгийн . . . . . . . . шатанд гарна.", "options": [{"letter": "A", "text": "судалгаа хөгжлийн үе"}, {"letter": "B", "text": "өсөлтийн үе"}, {"letter": "C", "text": "уналтын үе"}, {"letter": "D", "text": "танилцуулгын үе"}], "answer": "C"}, {"num": 28, "text": "Дараах зардлууд нь бүтээгдэхүүн үйлдвэрлэлтэй холбоотой гарсан болно. 1. Үйлдвэрлэлийн өртөг 2. Ашиглалтаас гаргах үеийн зардал 3. Хуваарилалтын өртөг 4. Дизайны өртөг Эдгээрээс аль нь бүтээгдэхүүний амьдралын мөчлөгөөр өртөг тооцоход орох вэ?", "options": [{"letter": "A", "text": "1, 2 ба 4"}, {"letter": "B", "text": "1, 2 ба 3"}, {"letter": "C", "text": "1, 2, 3 ба 4"}, {"letter": "D", "text": "Зөвхөн 1, 3"}], "answer": "C"}, {"num": 29, "text": "Амьдралын мөчлөгийн өртөг тооцох аргын зорилгод аль нь хамаарахгүй вэ?", "options": [{"letter": "A", "text": "Бүтээгдэхүүний бүх амьдралын мөчлөг дэх ашигт ажиллагаа үнэлэх"}, {"letter": "B", "text": "Бүтээгдэхүүний бүх амьдралын мөчлөг дэх нийт өртгийг үнэлэх"}, {"letter": "C", "text": "Бүтээгдэхүүний тайлант хугацааны өртгийг үнэлэх"}], "answer": "C"}, {"num": 30, "text": "Бүтээгдэхүүн үйлдвэрлэлийн хэмжээ аль үе шатнаас эхлэн нэмэгдэх вэ?", "options": [{"letter": "A", "text": "Судалгаа хөгжүүлэлтийн үе"}, {"letter": "B", "text": "Нэвтрэлтийн үе"}, {"letter": "C", "text": "Өсөлтийн үе"}, {"letter": "D", "text": "Тогтворжилтын үе"}], "answer": "B"}, {"num": 31, "text": "Дараах өгүүлбэрүүдийн аль нь зөв бэ? 1. Амьдралын мөчлөгөөр өртөг тооцох зорилго нь бүтээгдэхүүний бүхий л амьдралын турш дахь ашигтай байгаа эсэхийг тодорхойлох юм. 2. Амьдралын мөчлөгийн өртөг тооцолт нь бүтээгдэхүүний амьдралын бүхий л өртгийг авч үзэх бөгөөд зарцуулагдсан судалгаа хөгжүүлэлтийн зардлыг оруулахгүй.", "options": [{"letter": "A", "text": "1 зөв"}, {"letter": "B", "text": "1,2 зөв"}, {"letter": "C", "text": "2 зөв"}, {"letter": "D", "text": "1,2 буруу"}], "answer": "A"}, {"num": 32, "text": "Амьдралын мөчлөгөөр өртөг тооцолттой холбоотой буруу хариултыг сонго", "options": [{"letter": "A", "text": "Бүтээгдэхүүн амьдралын мөчлөг богино байхын хэрээр амьдралын мөчлөгийн зардал болон орлогыг тооцоход хялбар байдаг ба зардлыг хянах боломжтой"}, {"letter": "B", "text": "Үйлдвэрлэл үйлчилгээний аль нь ч байгууллага амьдралын мөчлөгийн өртгийн аргыг ашиглан тухайн бүтээгдэхүүн үйлчилгээний амьдралын мөчлөгийн явцад олох ашгийг тооцоолж болно"}, {"letter": "C", "text": "Багц бүтээгдэхүүний амьдралын мөчлөгийн өртгийг ихэвчлэн загвар зохиох болон хөгжүүлэлтийн шатанд тооцдог"}, {"letter": "D", "text": "Амьдралын мөчлөгийн өртөгт бүтээгдэхүүн хөгжүүлэлтийн зардлууд болон үйлдвэрлэл зогсооход гардаг зайлшгүй зардлууд багтдаг"}], "answer": "A"}, {"num": 33, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн өгөөжийг хамгийн их байлгахад дараах зүйлээс аль нь хамааралгүй вэ?", "options": [{"letter": "A", "text": "Бүтээгдэхүүний борлуулалтын үнийг хамгийн их байлгах"}, {"letter": "B", "text": "Зах зээлд нэвтрэх хугацааг багасгах"}, {"letter": "C", "text": "Хугарлын цэг дээрх хугацааг хамгийн бага байлгах"}, {"letter": "D", "text": "Бүтээгдэхүүний амьдрах хугацааг нэмэгдүүлэх"}], "answer": "A"}, {"num": 34, "text": "Амьдралын мөчлөгийн аль үе шатнаас эхлэн бүтээгдэхүүн үйлдвэрлэлийн зардал нэмэгдэх вэ?", "options": [{"letter": "A", "text": "Хөгжүүлэлтийн үе шат"}, {"letter": "B", "text": "Нэвтрэлтийн үе шат"}, {"letter": "C", "text": "Өсөлтийн үе шат"}, {"letter": "D", "text": "Тогтворжилтын үе шат"}], "answer": "B"}, {"num": 35, "text": "Бүтээгдэхүүний амьдралын мөчлөгийн аль үе шатанд зар сурталчилгааны зардал хамгийн их байх вэ?", "options": [{"letter": "A", "text": "Хөгжүүлэлтийн үе шат"}, {"letter": "B", "text": "Нэвтрэлтийн үе шат"}, {"letter": "C", "text": "Өсөлтийн үе шат"}, {"letter": "D", "text": "Тогтворжилтын үе шат"}], "answer": "B"}, {"num": 36, "text": "Амьдралын мөчлөгийн аль үе шатанд алдагдалтай ажилладаг вэ?", "options": [{"letter": "A", "text": "Нэвтрэлтийн үе шат"}, {"letter": "B", "text": "Өсөлтийн үе шат"}, {"letter": "C", "text": "Тогтворжилтын үе шат"}, {"letter": "D", "text": "Уналтын үе шат"}], "answer": "A"}]}, {"number": 5, "title": "Төгс ахиуц ашгийн хандлага (Throughput)", "questions": [{"num": 1, "text": "Төгс ахиуц ашгийн бүртгэлийн зарчимтай холбоотойгоор дараах ойлголтуудаас аль нь үнэн бэ? (i) Бараа материалын түвшинг хамгийн бага түвшинд байлгах шаардлагатай. (ii) Үйлдвэрийн бүх тоног төхөөрөмж нь ямар ч сул зогсолтгүй 100% үр ашигтай ажиллах ёстой.", "options": [{"letter": "A", "text": "Зөвхөн (i)"}, {"letter": "B", "text": "Зөвхөн (ii)"}, {"letter": "C", "text": "Дээрх бүгд"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "A"}, {"num": 2, "text": "Төгс ахиуц ашгийн бүртгэлийн үед дараахаас аль нь зөв бэ? (i) Төгс ахиуц ашгийг тооцох үед шууд хөдөлмөрийн зардлыг үргэлж үйлдвэрийн зардлын нэг хэсэг гэж үзнэ. (ii) Хэрэв машин цаг хязгаарлагдмал нөөц бол шууд хөдөлмөрийн үр ашгийг сайжруулах нь ямар ч ач холбогдолгүй.", "options": [{"letter": "A", "text": "Зөвхөн і"}, {"letter": "B", "text": "Зөвхөн іі"}, {"letter": "C", "text": "Аль нь ч биш"}, {"letter": "D", "text": "і ба іі"}], "answer": "D"}, {"num": 3, "text": "\"А\" үйлдвэрлэлийн компани төгс ахиуц ашгийн бүртгэлийг ашигладаг. Компанид ур чадвар шаардсан I зэрэглэлийн хөдөлмөр цаг хязгаарлагдмал нөөц болдог. Дараахаас алийг нь хэрэгжүүлбэл компани нийт төгс ахиуц ашгаа өсгөх боломжтой вэ? (i) Эрэлтийг өсгөхийн тулд зарим бүтээгдэхүүний борлуулалтын үнийг бууруулах. (ii) Хорогдлыг багасгах замаар машины ашиглалтын үр ашгийг сайжруулах. (iii) I зэрэглэлийн ажилчдыг илүү олон цаг ажиллуулахын тулд цагт 20,000₮-ийн илүү цагийн урамшуулал олгох.", "options": [{"letter": "A", "text": "(i)"}, {"letter": "B", "text": "(ii)"}, {"letter": "C", "text": "(iii)"}, {"letter": "D", "text": "Аль нь ч төгс ахиуц ашгийг өсгөхгүй"}], "answer": "C"}, {"num": 4, "text": "А компанийн үйлдвэрлэдэг Х бүтээгдэхүүний Төгс ахиуц ашгийн харьцаа нь 0.85 гарсан ба үүнийг нэмэгдүүлэхийн тулд тус компанийн удирдлагын зүгээс хэрэгжүүлэх дараах арга хэмжээний аль нь буруу вэ?", "options": [{"letter": "A", "text": "Нэгжийн борлуулалтын үнийг өсгөх."}, {"letter": "B", "text": "Материалын өртгийг бууруулах."}, {"letter": "C", "text": "Нэг машин цагт үйлдвэрлэх бүтээгдэхүүний хэмжээг бууруулах."}, {"letter": "D", "text": "Үйл ажиллагааны зардлыг бууруулах."}], "answer": "C"}, {"num": 5, "text": "Үйлдвэрлэлийг үр ашигтай удирдах нэг хандлага бол . . . . . . юм.", "options": [{"letter": "A", "text": "Төгс ахиуц ашгийн бүртгэл"}, {"letter": "B", "text": "Бүтээмжийн бүртгэл"}, {"letter": "C", "text": "Хязгаарлалтын онол"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "C"}, {"num": 6, "text": "Төгс ахиуц ашгийн харьцаа нь нэгж хүчин чадалд тодорхой бүтээгдэхүүний олж буй төгс ахиуц ашгийг нэгж хүчин чадалд ногдох үйл ажиллагааны зардалд агасгах, дахин боловсруулах"}, {"letter": "C", "text": "Өрсөлдөгч компанийн стратегийн дагуу хэрэглэгчдийн хэрэгцээг хангах"}, {"letter": "D", "text": "Нийгмийн сайн сайхны төлөө ажиллаж, байгууллагын нэр хүндийг өсгөх"}], "answer": "B"}, {"num": 8, "text": "Дараах зардлуудаас аль нь хүрээлэн буй орчны зардлын нөөцөд хамаарах вэ?", "options": [{"letter": "A", "text": "Үйлдвэрийн хаягдлыг тээвэрлэх зардал"}, {"letter": "B", "text": "Хүрээлэн буй орчны тайлан бэлтгэхтэй холбоотой зардал"}, {"letter": "C", "text": "Хүрээлэн буй орчныг бохирдуулсныг нөхөн сэргээх зардал"}, {"letter": "D", "text": "Агаарын бохирдол, хог хаягдлын татвар"}], "answer": "C"}, {"num": 9, "text": "ISO 14001 хүрээлэн буй орчны удирдлагын системд дараах зүйлс орно. (Зөв хариултыг сонго)", "options": [{"letter": "A", "text": "Удирдлагын систем"}, {"letter": "B", "text": "Хүрээлэн буй орчны бодлого"}, {"letter": "C", "text": "Хүрээлэн буй орчны үнэлгээ, үүрэг хариуцлага"}, {"letter": "D", "text": "Дээрх бүгд"}], "answer": "D"}, {"num": 10, "text": "Хүрээлэн буй орчны бүртгэлийн ач холбогдолд хамаарахгүйг сонгоно уу.", "options": [{"letter": "A", "text": "Ашиг, орлогоо нэмэгдүүлэх боломжтой."}, {"letter": "B", "text": "Нэгжийн хүрээлэн буй орчны зардлыг тооцсоноор нэгж бүтээгдэхүүний үнийг тогтооход ашиглах боломжтой."}, {"letter": "C", "text": "Хууль, эрх зүйн заалт, стандартуудын мөрдөлтийг хянах боломжтой."}, {"letter": "D", "text": "Зардлаа бууруулах боломжтой."}], "answer": "A"}, {"num": 11, "text": "ISO 14001 стандартын дагуу хүрээлэн буй орчны удирдлагын системд дараах зүйлсийг багтаан авч үздэг. /Бурууг сонго/", "options": [{"letter": "A", "text": "ISO 14001 стандартыг дагаж мөрдөж буй баталгаа"}, {"letter": "B", "text": "Хүрээлэн буй орчны үзүүлэлтийн үнэлгээ, хуулийн болон сайн дурын үүрэг хариуцлага"}, {"letter": "C", "text": "Дотоод аудит ба тайланг удирдлагад тайлагнах"}, {"letter": "D", "text": "Хүрээлэн буй орчны талаарх тайлан, дотоод аудитын тайлан зэргийг нийтэд тайлагнах"}], "answer": "D"}, {"num": 12, "text": "Хүрээлэн буй орчинтой холбоотой үүсэх зардлуудаас зөвийг сонгоно уу. і. Түүхий эд материал, тээвэрлэлт іі. Цэвэр усны хэрэглээ, эрчим хүч ііі. Бохир ус хэрэглээ, нөхөн сэргээлтийн бэлтгэл зардал іv. Хаягдал, хог хаягдлын тээвэрлэлт", "options": [{"letter": "A", "text": "і ба іv"}, {"letter": "B", "text": "іі ба і"}, {"letter": "C", "text": "і, іі, ііі"}, {"letter": "D", "text": "і, іі, іv"}], "answer": "D"}, {"num": 13, "text": "Хүрээлэн буй орчны бүртгэлд ашиглагддаггүй арга хандлага нь:", "options": [{"letter": "A", "text": "Орц, гарцын шинжилгээ"}, {"letter": "B", "text": "Өртгийн урсгалын шинжилгээ"}, {"letter": "C", "text": "Хүрээлэн буй орчны амьдралын мөчлөгийн өртөг тооцох систем"}, {"letter": "D", "text": "Хүрээлэн буй орчны өртөг, ашгийн хамаарлын шинжилгээ"}], "answer": "D"}, {"num": 14, "text": "Хүрээлэн буй орчинтой холбогдон гарах зардал хөтлөгч .................... байна.", "options": [{"letter": "A", "text": "Хаягдлын түвшин"}, {"letter": "B", "text": "Хог ачигчийн тоо"}, {"letter": "C", "text": "Хогийн цэгийн тоо"}, {"letter": "D", "text": "Зардлын гүйлгээний дүн"}], "answer": "A"}, {"num": 15, "text": "Хүрээлэн буй орчны бүртгэлийн гол хэрэглээ: /бурууг сонгоно уу/", "options": [{"letter": "A", "text": "Хүрээлэн буй орчинтой холбоотой жилийн зардлыг тооцох"}, {"letter": "B", "text": "Төсөвлөлт"}, {"letter": "C", "text": "Бүтээгдэхүүний үнэлгээ"}, {"letter": "D", "text": "Байгаль хамгаалах"}], "answer": "D"}, {"num": 16, "text": "Хүрээлэн буй орчны удирдлагын бүртгэл нь дараах ач холбогдолтой. Зөв ойлголтыг сонгоно уу.", "options": [{"letter": "A", "text": "Нэгж бүтээгдэхүүн болон үйлчилгээтэй холбогдон гарах хүрээлэн буй орчны зардлыг тооцсоноор энэ нь үнэ тогтоох шийдвэрт нөлөөлөхгүй."}, {"letter": "B", "text": "Хууль эрх зүйн стандартыг даган мөрдөж байгаа эсэхээ тодорхойлох боломжгүй."}, {"letter": "C", "text": "Нэгж бүтээгдэхүүн болон үйлчилгээтэй холбогдон гарах хүрээлэн буй орчны зардлыг тооцсоноор энэ нь үнэ тогтоох шийдвэрт нөлөөлнө."}, {"letter": "D", "text": "Хууль эрх зүйн стандартыг даган мөрдөж байгаа эсэхийг авч үздэггүй"}], "answer": "B"}, {"num": 17, "text": "Хүрээлэн буй орчны . . . . . . . . зардалд байгууллагын бусдад учруулсан зардлыг авч үзнэ. Жишээлбэл, олон нийтэд учруулсан хохирол.", "options": [{"letter": "A", "text": "дотоод"}, {"letter": "B", "text": "гадаад"}, {"letter": "C", "text": "үнэлгээний"}, {"letter": "D", "text": "хууль эрх зүйн хэрэгжилтийн"}], "answer": "B"}, {"num": 18, "text": "Дараах ойлголтуудаас бурууг тэмдэглэнэ үү.", "options": [{"letter": "A", "text": "Орц гарцын шинжилгээ нь үйлдвэрлэлд юу орж юу гарч байгааг шинжилдэг."}, {"letter": "B", "text": "Орц ба гарц нь биет тоо хэмжээгээр хэмжигдэх ба тоо хэмжээнд эрчим хүч болон усыг багтаадаг."}, {"letter": "C", "text": "Хүрээлэн буй орчны удирдлагын бүртгэлийн арга барилд өртгийн шинээр боловсруулах, орц гарцын шинжилгээ хийх нь иж бүрэн болгодог."}, {"letter": "D", "text": "Имидж болон арилжааны зардал нь үйлдвэрийн хүрээлэн буй орчны тайлангийн зардал гэх мэт."}], "answer": "C"}, {"num": 19, "text": "ISO 14001 хүрээлэн буй орчны удирдлагын системд хамааралгүй зүйлийг сонгоно уу.", "options": [{"letter": "A", "text": "Удирдлагын систем"}, {"letter": "B", "text": "Хүрээлэн буй орчны бодлого"}, {"letter": "C", "text": "Хүрээлэн буй орчны үнэлгээ, үүрэг хариуцлага"}, {"letter": "D", "text": "Байгууллагын чанарын хяналтын удирдлагын бодлого"}], "answer": "D"}, {"num": 20, "text": "Дараах зардлаас аль нь бүтээгдэхүүний үйлчилгээний өртөгт шингэх хүрээлэн буй орчны зардал биш вэ?", "options": [{"letter": "A", "text": "Хог хаягдлын тээвэрлэлтийн зардал"}, {"letter": "B", "text": "Эрчим хүч, усны хэрэглээний зардал"}, {"letter": "C", "text": "Түүхий эд материалын зардал"}, {"letter": "D", "text": "Нийгэм хамгааллын зардал"}], "answer": "C"}, {"num": 21, "text": "Удирдлагын бүртгэлийн аргуудын талаар мэдээлэл өгөгдөв. I. Хүрээлэн буй орчны амьдралын мөчлөгийн арга II. Өртгийн урсгалын бүртгэл III. Хүрээлэн буй орчны үйлдэлд суурилсан өртөг тооцох систем IV. Орц гарцын шинжилгээ Эдгээрээс аль нь хүрээлэн буй орчны зардлыг бүртгэхэд хэрэглэдэг арга вэ?", "options": [{"letter": "A", "text": "I, III"}, {"letter": "B", "text": "II, IV"}, {"letter": "C", "text": "I, II, III"}, {"letter": "D", "text": "I, II, III, IV"}], "answer": "D"}, {"num": 22, "text": "Хүрээлэн буй орчны бүртгэлд ашигладаг арга хандлага нь I. Орц гарцын шинжилгээ II. Үйлдэлд суурилсан өртөг тооцох систем III. Амьдралын мөчлөгийн өртөг IV. Өртөг ашгийн хамаарлын шинжилгээ V. Өртгийн урсгалын шинжилгээ", "options": [{"letter": "A", "text": "I, II, III, IV, V"}, {"letter": "B", "text": "I, II, III, V"}, {"letter": "C", "text": "I, IV, V"}, {"letter": "D", "text": "I, II, III, IV"}], "answer": "B"}, {"num": 23, "text": "Хүрээлэн буй орчныг бохирдуулсны төлөө ирээдүйд нөхөн сэргээх зардлыг зардлын аль төрөлд хамааруулах вэ?", "options": [{"letter": "A", "text": "Хувиргалтын зардал"}, {"letter": "B", "text": "Байгууллагын нэр хүндийг хамгаалах зардал"}, {"letter": "C", "text": "Боломжит нуугдмал зардал"}, {"letter": "D", "text": "Хүрээлэн буй орчны зардлын нөөц"}], "answer": "D"}, {"num": 24, "text": "Дараахаас аль аргыг хүрээлэн буй орчны бүртгэлийн үед ашигладаггүй вэ?", "options": [{"letter": "A", "text": "Төгс ахиуц ашгийн бүртгэл"}, {"letter": "B", "text": "Орц гарцын шинжилгээ"}, {"letter": "C", "text": "Урсгал өртгийн бүртгэл"}, {"letter": "D", "text": "Үйлдэлд суурилсан өртөг тооцолт"}], "answer": "A"}, {"num": 25, "text": "Хүрээлэн буй орчны бүртгэлд ашигладаг орц, гарцын шинжилгээтэй холбоотой зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Эерэг болон сөрөг бүтээгдэхүүний нийлбэр нь орцын хэмжээтэй тэнцүү байна."}, {"letter": "B", "text": "Орц гарцын шинжилгээг бүтээгдэхүүний амьдралын мөчлөгийн хугацаанд 1 удаа тооцдог."}, {"letter": "C", "text": "Удирдлага нь эерэг болон сөрөг бүтээгдэхүүний хэмжээг бууруулахад анхаардаг."}, {"letter": "D", "text": "Хаягдлыг устгах зардал нь эерэг бүтээгдэхүүний нэгжийн өртгийг бууруулна."}], "answer": "A"}, {"num": 26, "text": "Тогтвортой хөгжлийн олон улсын хорооноос хүрээлэн буй орчны зардлыг бүртгэх удирдлагын бүртгэлийн арга барилыг тодорхойлж өгсөн. Үйлдвэрлэлд ямар орц орно тэр нь гарц болон гарна гэсэн үзэлд суурилдаг аргачлал аль нь вэ?", "options": [{"letter": "A", "text": "Орц, гарцын шинжилгээ"}, {"letter": "B", "text": "Хүрээлэн буй орчны үйлдэлд суурилсан өртөг тооцох систем"}, {"letter": "C", "text": "Хүрээлэн буй орчны амьдралын мөчлөгийн өртөг тооцох систем"}, {"letter": "D", "text": "Мөнгөн урсгалын шинжилгээ"}], "answer": "A"}]}, {"number": 7, "title": "Өртөг, тоо хэмжээ, ашгийн хамаарлын (ӨТХА) шинжилгээ", "questions": [{"num": 1, "text": "Олон бүтээгдэхүүн үйлдвэрлэдэг компанийн дараах мэдээлэл өгөгдсөн: (i) Бүтээгдэхүүний хольцын харьцаа (ii) Бүтээгдэхүүн бүрийн ахиуц ашгийн харьцаа (iii) Ерөнхий тогтмол зардал (iv) Ерөнхий тогтмол зардлыг хуваарилах арга Дээрхээс аль нь компанийн хугарлын цэг дээрх борлуулалтыг тооцоход шаардлагатай вэ?", "options": [{"letter": "A", "text": "Дээрх бүгд"}, {"letter": "B", "text": "Зөвхөн (i), (ii) болон (iii)"}, {"letter": "C", "text": "Зөвхөн (i), (iii) болон (iv)"}, {"letter": "D", "text": "Зөвхөн (ii) болон (iii)"}], "answer": "B"}, {"num": 2, "text": "Буруу хариултыг ол.", "options": [{"letter": "A", "text": "Ахиуц ашиг бүтээгдэхүүн үйлдвэрлэлтэй шууд хамааралтай."}, {"letter": "B", "text": "Ахиуц ашгийн харьцаа өндөртэй бүтээгдэхүүний ашиг их байна."}, {"letter": "C", "text": "Борлуулалтын өөрчлөлтөөс хамаарч ашиг хэрхэн өөрчлөгдөж байгааг үйл ажиллагааны хөшүүргийн зэрэг илэрхийлнэ."}, {"letter": "D", "text": "Ахиуц ашгийг орлогоос үйлдвэрлэлийн хувьсах зардлыг хасч тооцно."}], "answer": "D"}, {"num": 3, "text": "Олон төрлийн бүтээгдэхүүн үйлдвэрлэлийн үед зорилтот ашгийг олоход шаардлагатай үйлдвэрлэлийн хэмжээг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Тогтмол зардал / Нэгжийн ахиуц ашиг"}, {"letter": "B", "text": эгжийн хувьсах зардлын өсөлт хугарлын цэг дээрх бүтээгдэхүүний тоо хэмжээг өсгөнө."}], "answer": "A"}, {"num": 8, "text": "Дараах өгөгдлөөс зөв хариултыг сонго.", "options": [{"letter": "A", "text": "Хэвийн хүчин чадлын хүрээнд үйлдвэрлэлийн хэмжээ өсөх тусам нэгжийн өртөг өсдөг."}, {"letter": "B", "text": "Хамгаалалтын хязгаарын утга бага байх тусам ашиг олох магадлал өндөр байна."}, {"letter": "C", "text": "Үйл ажиллагааны хөшүүрэг өндөр бол борлуулалтын орлогод ногдох ашгийн өөрчлөлт их байна"}, {"letter": "D", "text": "Олон төрлийн бүтээгдэхүүн үйлдвэрлэн борлуулдаг байгууллагын хувьд хугарлын цэгийг бүтээгдэхүүн тус бүрийн хувьд орлогоор тооцох боломжгүй."}], "answer": "C"}, {"num": 9, "text": "Хэрэв багц бүтээгдэхүүний борлуулалтын үед бүх бүтээгдэхүүний ахиуц ашгийн харьцаа ижил бол ....................................", "options": [{"letter": "A", "text": "Борлуулалтын багц нь хугарлын цэгийн шинжилгээнд нөлөөлөхгүй"}, {"letter": "B", "text": "Борлуулалтын багц нь хугарлын цэгийн шинжилгээнд нөлөөлнө"}, {"letter": "C", "text": "Практикт тийм боломж байхгүй"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "A"}, {"num": 10, "text": "Ямар үед компанийн цэвэр ашгийн хэмжээ өндөр байх вэ?", "options": [{"letter": "A", "text": "Борлуулалт хэвээрээ боловч тогтмол зардал өсөх үед."}, {"letter": "B", "text": "Тогтмол зардал, борлуулалт хэвээрээ боловч ахиуц ашгийн харьцаа буурах үед."}, {"letter": "C", "text": "Ахиуц ашгийн харьцаа болон хугарлын цэг өсөх үед."}, {"letter": "D", "text": "Борлуулалтын орлогоорх хугарлын цэг өндөр үед."}], "answer": "C"}, {"num": 11, "text": "Дараах нөхцлүүдийн аль нь хугарлын цэгийг илэрхийлж байна вэ?", "options": [{"letter": "A", "text": "Ахиуц ашиг тогтмол зардалтай тэнцүү үед."}, {"letter": "B", "text": "Борлуулалтын орлого хувьсах зардалтай тэнцүү үед."}, {"letter": "C", "text": "Ахиуц ашиг хувьсах зардалтай тэнцүү үед."}, {"letter": "D", "text": "Борлуулалтын орлого тогтмол зардалтай тэнцүү үед."}], "answer": "A"}, {"num": 12, "text": "Хугарлын цэгийг борлуулалтын орлогоор хэрхэн тооцоолох вэ?", "options": [{"letter": "A", "text": "Нийт тогтмол зардлыг нэгжийн борлуулалтын үнэнд харьцуулна."}, {"letter": "B", "text": "Нийт тогтмол зардлыг нэгжийн ахиуц ашигтай харьцуулна."}, {"letter": "C", "text": "Нийт тогтмол зардлыг ахиуц ашгийн харьцаанд харьцуулна."}, {"letter": "D", "text": "Нийт тогтмол зардлыг нийт ахиуц ашигтай харьцуулна."}], "answer": "C"}, {"num": 13, "text": "Хугарлын цэгийн шинжилгээтэй холбоотой буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Ашиг алдагдалгүй үйл ажиллагаа явуулах үйл ажиллагааны түвшин"}, {"letter": "B", "text": "Нэгжийн ахиуц ашиг өсөхөд хугарлын цэг буурна"}, {"letter": "C", "text": "Нийт тогтмол зардал өсөхөд хугарлын цэг өснө"}, {"letter": "D", "text": "Нэгжийн хувьсах зардал буурахад хугарлын цэг өснө"}], "answer": "D"}, {"num": 14, "text": "СVР - Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээний үед дараахаас аль нь үнэн бэ? і. Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээ гэдэг нь үйл ажиллагааны ялгаатай түвшинд өртөг, тоо хэмжээ, ашгийн хоорондын хамаарлыг судлахыг хэлнэ. іі. Багц бүтээгдэхүүний хувьд хугарлын цэгийг тодорхойлохдоо нийт тогтмол зардлыг жинлэсэн дундаж ахиуц ашгийн харьцаа эсвэл багцын ахиуц ашгийн харьцаанд хуваадаг.", "options": [{"letter": "A", "text": "Зөвхөн і"}, {"letter": "B", "text": "Зөвхөн іі"}, {"letter": "C", "text": "і ба іі"}, {"letter": "D", "text": "аль нь ч биш"}], "answer": "C"}, {"num": 15, "text": "СVР - Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээний үед дараахаас аль нь үнэн бэ? і. Хэрэв багцад ахиуц ашиг өндөртэй бүтээгдэхүүн зонхилбол хугарлын цэг өсч, ашиг өснө. іі. Борлуулалтын багцын харьцаа өөрчлөгдөх нь багцын ахиуц ашиг болон ахиуц ашгийн харьцаанд нөлөөлөх бөгөөд улмаар хугарлын цэг өөрчлөгдөнө.", "options": [{"letter": "A", "text": "Зөвхөн і"}, {"letter": "B", "text": "Зөвхөн іі"}, {"letter": "C", "text": "і ба іі"}, {"letter": "D", "text": "аль нь ч биш"}], "answer": "B"}, {"num": 16, "text": "Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээнд тогтмол зардлын өөрчлөлт нь:", "options": [{"letter": "A", "text": "Хугарлын цэг болон ахиуц ашгийн харьцаанд нөлөө үзүүлэхгүй."}, {"letter": "B", "text": "Хугарлын цэг болон ахиуц ашгийн харьцааг аль алиныг өөрчлөх нөлөө үзүүлнэ."}, {"letter": "C", "text": "Хугарлын цэгийг өөрчлөх боловч ахиуц ашгийн харьцаанд нөлөөлөхгүй."}, {"letter": "D", "text": "Хугарлын цэгт нөлөөлөхгүй боловч ахиуц ашгийн харьцааг өөрчилнө."}], "answer": "C"}, {"num": 17, "text": "Дараах ойлголтуудаас буруу хариултыг сонго.", "options": [{"letter": "A", "text": "Үйл ажиллагааны хөшүүргийн зэрэг их байх тусам борлуулалтын багахан өөрчлөлтөд ашгийн өөрчлөгдөх хэмжээ их байна."}, {"letter": "B", "text": "Хугарлын цэгээс хол үйл ажиллагаа явуулах тусам үйл ажиллагааны хөшүүргийн зэрэг өсөж байдаг."}, {"letter": "C", "text": "Үйл ажиллагааны хөшүүргийн зэрэг бага байх нь борлуулалтын өөрчлөлтийг мэдрэх ашгийн мэдрэмж сул байна."}, {"letter": "D", "text": "Хувьсах зардал нь тогтмол зардлаасаа их байх тусам үйл ажиллагааны хөшүүрэг багасна."}], "answer": "B"}, {"num": 18, "text": "Дараах төсөөллүүдээс аль нь өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээнд ашиглагддаггүй вэ?", "options": [{"letter": "A", "text": "Гарцын бүхий л хэмжээнд нийт тогтмол зардал өөрчлөгдөхгүй"}, {"letter": "B", "text": "Олон төрлийн бүтээгдэхүүн үйлдвэрлэж, борлуулдаг аж ахуй нэгжийн бүтээгдэхүүний хольц тогтмол байна"}, {"letter": "C", "text": "Үйлдвэрлэсэн бүх бүтээгдэхүүн борлогдоно."}, {"letter": "D", "text": "Нэгжид ногдох хувьсах зардал гарцын хэмжээг дагаж өөрчлөгдөнө."}], "answer": "D"}, {"num": 19, "text": "Хугарлын цэг дээрх борлуулалтын орлогыг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Тогтмол зардал / Нэгжийн ахиуц ашиг"}, {"letter": "B", "text": "Тогтмол зардал / Ахиуц ашгийн харьцаа"}, {"letter": "C", "text": "Нэгжийн борлуулалтын үнэ / Ахиуц ашгийн харьцаа"}, {"letter": "D", "text": "Нэгжийн борлуулалтын үнэ / Нэгжийн ахиуц ашиг"}], "answer": "B"}, {"num": 20, "text": "Дараахаас аль тохиолдолд үйл ажиллагааны хөшүүргийн зэрэг өндөр байх вэ?", "options": [{"letter": "A", "text": "Тогтмол зардлын харьцаа их, хувьсах зардлын харьцаа бага, ахиуц ашгийн хэмжээ бага байвал"}, {"letter": "B", "text": "Тогтмол зардлын харьцаа бага, хувьсах зардлын харьцаа их, ахиуц ашгийн хэмжээ бага байвал"}, {"letter": "C", "text": "Тогтмол зардлын харьцаа их, хувьсах зардлын харьцаа бага, ахиуц ашгийн хэмжээ их байвал"}, {"letter": "D", "text": "Тогтмол зардлын харьцаа бага, хувьсах зардлын харьцаа их, ахиуц ашгийн хэмжээ их байвал"}], "answer": "C"}, {"num": 21, "text": "Үйл ажиллагааны хөшүүргийн зэргийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Ахиуц ашиг / Үйл ажиллагааны ашиг"}, {"letter": "B", "text": "Зорилтот ашиг / Үйл ажиллагааны ашиг"}, {"letter": "C", "text": "Үйл ажиллагааны ашиг / Ахиуц ашиг"}, {"letter": "D", "text": "Үйл ажиллагааны ашиг / Зорилтот ашиг"}], "answer": "A"}, {"num": 22, "text": "Дараахаас аль нь хугарлын цэгтэй урвуу хамааралтай вэ?", "options": [{"letter": "A", "text": "Нийт тогтмол зардал"}, {"letter": "B", "text": "Нэгжийн хувьсах зардал"}, {"letter": "C", "text": "Нэгжийн борлуулалтын үнэ"}, {"letter": "D", "text": "Бүтээгдэхүүний тоо хэмжээ"}], "answer": "C"}, {"num": 23, "text": "Хугарлын цэгийн шинжилгээтэй холбоотой зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Нийт тогтмол зардал өсөхөд хугарлын цэг буурна."}, {"letter": "B", "text": "Нэгжийн хувьсах зардал өсөхөд хугарлын цэг буурна."}, {"letter": "C", "text": "Нэгжийн борлуулалтын үнэ өсөхөд хугарлын цэг буурна."}, {"letter": "D", "text": "Бүтээгдэхүүний тоо хэмжээ өсөхөд хугарлын цэг буурна."}], "answer": "C"}, {"num": 24, "text": "Хугарлын цэгийн шинжилгээ хийхтэй холбоотой буруу ойлголтыг сонгоно уу.", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн хэмжээ = Борлуулалтын хэмжээ"}, {"letter": "B", "text": "Үйл ажиллагааны бүх түвшинд борлуулалтын үнэ тогтмол байна."}, {"letter": "C", "text": "Нийт тогтмол зардал болон нэгжийн хувьсах зардал нь гарцын бүхий л түвшинд тогтмол байна."}, {"letter": "D", "text": "Нийт хувьсах зардал болон нэгжийн тогтмол зардал нь гарцын бүхий л түвшинд тогтмол байна."}], "answer": "D"}, {"num": 25, "text": "Цэвэр ахиуц ашгийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Ахиуц ашиг / Борлуулалт"}, {"letter": "B", "text": "Үйл ажиллагааны ашиг / Борлуулалт"}, {"letter": "C", "text": "Нийт ашиг / Борлуулалт"}, {"letter": "D", "text": "Ахиуц ашгийн харьцаа / Борлуулалт"}], "answer": "B"}, {"num": 26, "text": "Хамгаалалтын хязгаарын харьцаа гэдэг нь .................... юм.", "options": [{"letter": "A", "text": "(Төсөвлөсөн борлуулалт - гүйцэтгэлийн борлуулалт) / төсөвлөсөн борлуулалт"}, {"letter": "B", "text": "(Төсөвлөсөн борлуулалт - хугарлын цэг дэх борлуулалт) / төсөвлөсөн борлуулалт"}, {"letter": "C", "text": "(Гүйцэтгэлийн борлуулалт - хугарлын цэг дэх борлуулалт) / гүйцэтгэлийн борлуулалт"}, {"letter": "D", "text": "(Хугарлын цэг дэх борлуулалт - гүйцэтгэлийн борлуулалт) / хугарлын цэг дэх борлуулалт"}], "answer": "B"}, {"num": 27, "text": "Дараах илэрхийллүүдтэй холбоотой зөв хариултыг сонго. Ⅰ. Багц бүтээгдэхүүний хамгаалалтын хязгаар нь төсөвлөсөн борлуулалт ба багц бүтээгдэхүүний хугарлын цэг дээрх борлуулалтын зөрүүгээр тодорхойлогдоно. Ⅱ. Хамгаалалтын хязгаарын харьцаа нь төсөвлөсөн борлуулалтанд эзлэх хувийн жингээр тодорхойлогдоно.", "options": [{"letter": "A", "text": "Ⅰ, Ⅱ зөв"}, {"letter": "B", "text": "Ⅰ зөв, Ⅱ буруу"}, {"letter": "C", "text": "Ⅰ буруу, Ⅱ зөв"}, {"letter": "D", "text": "Ⅰ, Ⅱ буруу"}], "answer": "A"}, {"num": 28, "text": "Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээний тооцооллыг ....................", "options": [{"letter": "A", "text": "Зөвхөн урт хугацааны шийдвэр гаргалтын таамаглахад ашиглана."}, {"letter": "B", "text": "Зөвхөн богино хугацааны шийдвэр гаргалтын таамаглахад ашиглана."}, {"letter": "C", "text": "Зарим тохиолдолд богино хугацааны шийдвэрт ашиглана. Ихэнхдээ урт хугацааны шийдвэрт тустай"}, {"letter": "D", "text": "Зарим тохиолдолд урт хугацааны шийдвэрт ашиглана. Ихэнхдээ богино хугацааны шийдвэрт тустай."}], "answer": "B"}, {"num": 29, "text": "Дараахаас аль нь өртөг тоо хэмжээ ашгийн хамаарлын шинжилгээний давуу тал вэ?", "options": [{"letter": "A", "text": "Гарцын бүх түвшинд нийт тогтмол зардал болон нэгжийн хувьсах зардал өөрчлөгдөхгүй"}, {"letter": "B", "text": "Үйл ажиллагааны бүх түвшинд борлуулалтын үнэ тогтмол"}, {"letter": "C", "text": "Үйлдвэрлэл, борлуулалтын хэмжээ тэнцүү гэж үзэн тооцоолол хийдэг"}, {"letter": "D", "text": "Үйл ажиллагааны ямар ч түвшинд ашиг алдагдлыг тооцох боломж олгодог."}], "answer": "D"}, {"num": 30, "text": "Хугарлын цэгийн борлуулалтын орлого нь дараах томьёотой.", "options": [{"letter": "A", "text": "Нийт тогтмол зардал/ахиуц ашгийн харьцаа"}, {"letter": "B", "text": "Нийт тогтмол зардал/нэгжийн ахиуц орлого"}, {"letter": "C", "text": "Хугарлын цэг дэх нийт ахиуц ашиг/нэгжийн ахиуц орлого"}, {"letter": "D", "text": "Хугарлын цэг дэх нийт ахиуц ашиг/ ахиуц орлогын харьцаа"}], "answer": "A"}, {"num": 31, "text": "Дараах өгүүлбэрүүдийн аль нь зөв бэ? 1. Олон төрлийн бүтээгдэхүүний ашиг-тоо хэмжээний график нь хугарлын цэгийн борлуулалтын орлогын эсрэг бүтээгдэхүүн бүрийн ахиуц ашгийг харуулдаг. 2. Олон төрлийн бүтээгдэхүүний хугарлын цэгийн график нь борлуулалтын хольцыг тогтмол гэж авч үздэг.", "options": [{"letter": "A", "text": "Зөвхөн 1-р өгүүлбэр зөв"}, {"letter": "B", "text": "1 ба 2 өгүүлбэр бүгд зөв"}, {"letter": "C", "text": "Зөвхөн 2-р өгүүлбэр зөв"}, {"letter": "D", "text": "1 ба 2 өгүүлбэр бүгд буруу"}], "answer": "C"}, {"num": 32, "text": "Дараах мэдээлэл нь нэг төрлийн бүтээгдэхүүн үйлдвэрлэдэг компанитай холбоотой: 1. Нийт тогтмол зардал, 2. Ахиуц ашгийн харьцаа, 3. Төсөвлөсөн борлуулалтын нэгж. Эдгээрээс аль нь хугарлын цэгийн орлогыг тооцоолоход ашиглах вэ?", "options": [{"letter": "A", "text": "1 ба 3 үзүүлэлтийг ашиглана."}, {"letter": "B", "text": "1, 2 ба 3 үзүүлэлтийг ашиглана."}, {"letter": "C", "text": "2 ба 3 үзүүлэлтийг ашиглана."}, {"letter": "D", "text": "1 ба 2 үзүүлэлтийг ашиглана."}], "answer": "D"}, {"num": 33, "text": "Үйл ажиллагааны хөшүүргийн зэргийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Ахиуц ашгийн харьцааг цэвэр ашигт харьцуулна."}, {"letter": "B", "text": "Ахиуц ашгийг цэвэр ашигт харьцуулна."}, {"letter": "C", "text": "Цэвэр ашгийг ахиуц ашигт харьцуулна."}, {"letter": "D", "text": "Цэвэр ашгийг ахиуц ашгийн харьцаанд харьцуулна."}], "answer": "B"}, {"num": 34, "text": "Бурууг сонгоно уу?", "options": [{"letter": "A", "text": "Хугарлын цэгийн шинжилгээ гэдэг нь үйл ажиллагааны янз бүрийн түвшин дэх өртөг, тоо хэмжээ, ашгийн хоорондын хамаарлыг судлахыг хэлнэ."}, {"letter": "B", "text": "Борлуулалтын бүтэц хувьсах үед багц бүтээгдэхүүний хугарлын цэгийн шинжилгээ хийнэ."}, {"letter": "C", "text": "Төсөвлөсөн борлуулалтын орлого = Хамгаалалтын хязгаар + Хугарлын цэгийн борлуулалт"}, {"letter": "D", "text": "Хамгаалалтын хязгаарын харьцаа = Хамгаалалтын хязгаар / Төсөвлөсөн борлуулалт"}], "answer": "B"}, {"num": 35, "text": "Хугарлын цэг дээрх борлуулалтын тоо хэмжээний үед үйл ажиллагааны ашиг ......... байна.", "options": [{"letter": "A", "text": "тэгтэй тэнцүү"}, {"letter": "B", "text": "тэгээс ямагт их"}, {"letter": "C", "text": "тэгээс ямагт бага"}, {"letter": "D", "text": "тэгтэй тэнцүү буюу тэгээс их"}], "answer": "A"}, {"num": 36, "text": "Зардал, тоо хэмжээ, ашгийн хамаарлын шинжилгээг зөвхөн нэг төрлийн бүтээгдэхүүн үйлдвэрлэн борлуулдаг эсвэл нэгээс олон төрлийн боловч борлуулалтын тогтмол бүтэцтэй байгууллагын хувьд ашиглах боломжгүй. Энэ нь . . . . . . . . . .", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "B"}, {"num": 37, "text": "Хамгаалалтын хязгаарыг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Төсөвлөсөн борлуулалт - Хугарлын цэг дээрх борлуулалт"}, {"letter": "B", "text": "Төсөвлөсөн борлуулалт - Гүйцэтгэлээр борлуулалт"}, {"letter": "C", "text": "Гүйцэтгэлээр борлуулалт - Хугарлын цэг дээрх борлуулалт"}, {"letter": "D", "text": "Гүйцэтгэлээр борлуулалт - Төсөвлөсөн борлуулалт"}], "answer": "A"}, {"num": 38, "text": "Хугарлын цэг дээрх борлуулалтын тоо хэмжээний үед “.........” байна.", "options": [{"letter": "A", "text": "Нийт ахиуц ашиг > Нийт тогтмол зардал"}, {"letter": "B", "text": "Нийт ахиуц ашиг = Нийт тогтмол зардал"}, {"letter": "C", "text": "Нийт ахиуц ашиг < Нийт тогтмол зардал"}, {"letter": "D", "text": "Нийт ахиуц ашиг ≤ Нийт тогтмол зардал"}], "answer": "B"}, {"num": 39, "text": "Нэгж бүтээгдэхүүнээс олох ахиуц ашиг өндөр байх тусам хугарлын цэг дээрх борлуулалтын тоо хэмжээ .........", "options": [{"letter": "A", "text": "Өснө"}, {"letter": "B", "text": "Буурна"}, {"letter": "C", "text": "Өөрчлөгдөхгүй"}, {"letter": "D", "text": "Тооцох боломжгүй"}], "answer": "B"}, {"num": 40, "text": "Өртөг, тоо хэмжээ, ашгийн хамаарлын шинжилгээтэй холбоотой буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Гарцын /хүчин чадлын/ бүхий л түвшинд тогтмол зардал өөрчлөгдөхгүй."}, {"letter": "B", "text": "Үйл ажиллагааны бүхий л түвшинд борлуулалтын үнэ тогтмол байна."}, {"letter": "C", "text": "Үйлдвэрлэл болон борлуулалтын хэмжээ тэнцүү гэж үздэг."}, {"letter": "D", "text": "Нэгжийн хувьсах зардал нь гарцын хэмжээнээс шалтгаалан өөрчлөгдөнө."}], "answer": "D"}, {"num": 41, "text": "Зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Хугарлын цэгийн борлуулалтын орлого = Нийт хувьсах зардал/Ахиуц ашгийн харьцаа"}, {"letter": "B", "text": "Хугарлын цэгийн борлуулалтын орлого = Тогтмол зардал/Нэгжийн ахиуц ашиг"}, {"letter": "C", "text": "Хугарлын цэгийн борлуулалтын орлого = Нийт тогтмол зардал/Нэгжийн ахиуц ашиг"}, {"letter": "D", "text": "Хугарлын цэгийн борлуулалтын орлого = Тогтмол зардал/Ахиуц ашгийн харьцаа"}], "answer": "D"}, {"num": 42, "text": "Зорилтот ашгийн түвшин дэх борлуулалтыг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "(Тогтмол зардал + Зорилтот ашиг) / Нэгжийн хувьсах зардал"}, {"letter": "B", "text": "(Тогтмол зардал + Зорилтот ашиг) / Нэгжийн ахиуц ашиг"}, {"letter": "C", "text": "(Тогтмол зардал - Зорилтот ашиг) / Нэгжийн хувьсах зардал"}, {"letter": "D", "text": "(Тогтмол зардал - Зорилтот ашиг) / Нэгжийн ахиуц ашиг"}], "answer": "B"}, {"num": 43, "text": "Ахиуц ашигтай холбоотой дараах ойлголтуудаас буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Ахиуц ашиг гэдэг нь хувьсах зардлыг нөхөөд үлдэж байгаа борлуулалтын орлого юм."}, {"letter": "B", "text": "Ахиуц ашгийн тайланг зөвхөн удирдлагын шийдвэр гаргалтын зорилгоор ашиглана."}, {"letter": "C", "text": "Тогтмол зардал нь богино хугацааны шийдвэр гаргалтанд нөлөөлөхгүй учраас ахиуц ашгийн тооцоололд авч үзэхгүй."}, {"letter": "D", "text": "Борлуулалтын орлогоос үйлдвэрлэлийн хувьсах зардлыг хассанаар ахиуц ашиг тодорхойлогдоно."}], "answer": "D"}, {"num": 44, "text": "Хэрвээ ахиуц ашиг нь тэгээс их бол .... /Зөв хариуг сонго/", "options": [{"letter": "A", "text": "Худалдах үнэ нь нэгжийн хувьсах зардлаас бага."}, {"letter": "B", "text": "Нийт хувьсах зардал нь нийт орлогоос бага"}, {"letter": "C", "text": "Компани ашигтай ажиллаж байгааг илтгэнэ."}, {"letter": "D", "text": "Нийт тогтмол зардал нь нийт хувьсах зардлаас их."}], "answer": "B"}, {"num": 45, "text": "Хугарлын цэгийг бүтээгдэхүүний тоо хэмжээгээр хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Нийт тогтмол зардлыг нийт ахиуц ашигт харьцуулна"}, {"letter": "B", "text": "Нийт тогтмол зардлыг ахиуц ашгийн харьцаанд харьцуулна."}, {"letter": "C", "text": "Нийт тогтмол зардлыг нэгжийн ахиуц ашигт харьцуулна."}, {"letter": "D", "text": "Нийт тогтмол зардлыг хувьсах зардлын харьцаанд харьцуулна."}], "answer": "C"}, {"num": 46, "text": ".............. нь үйл ажиллагааны янз бүрийн түвшин дэх өртөг, тоо хэмжээ, ашгийн хоорондын хамаарлыг судладаг.", "options": [{"letter": "A", "text": "Зорилтот түвшин дэх борлуулалтын орлого"}, ": "Дотоод үнэ"}, {"letter": "D", "text": "Сүүдрийн үнэ"}], "answer": "D"}, {"num": 18, "text": "Компани долоо хоногт хоёр бүтээгдэхүүнээсээ хэдэн ширхэгийг үйлдвэрлэхээ шийдэхийн тулд шугаман програмчлалыг ашиглаж байна. Долоо хоног тутмын үйлдвэрлэл нь Х бүтээгдэхүүний х нэгж, Ү бүтээгдэхүүний у нэгж байх болно. Долоо хоног бүр 50-аас доошгүй ширхэг Х бүтээгдэхүүн үйлдвэрлэсэн байх ёстой бөгөөд долоо хоног бүр Х-ээс дор хаяж хоёр дахин их хэмжээний Ү үйлдвэрлэсэн байх ёстой. Х-ийн нэгж бүрд 30 минутын хөдөлмөр, Ү-ийн нэгж бүр хоёр цагийн хөдөлмөр шаарддаг. Долоо хоногт 5000 цаг ажиллах боломжтой. Дараах хязгаарлалтуудын аль нь зөв бэ?", "options": [{"letter": "A", "text": "0.5x + 2y ≤ 5,000, x ≥ 50, y ≤ 2x"}, {"letter": "B", "text": "x + 4y ≤ 5,000, x ≥ 50, y ≥ 2x"}, {"letter": "C", "text": "0.5x + 2y ≤ 5,000, x = 50, y ≥ 100"}, {"letter": "D", "text": "0.5x + 2y ≤ 5,000, x ≥ 50, y ≥ 2x"}], "answer": "D"}, {"num": 19, "text": "Дараах зүйлсийн аль нь хязгаарлагч хүчин зүйл вэ?", "options": [{"letter": "A", "text": "Ашиг"}, {"letter": "B", "text": "Борлуулалтын эрэлт"}, {"letter": "C", "text": "Нийт зах зээлийн багтаамж"}, {"letter": "D", "text": "Татварын зардал"}], "answer": "B"}, {"num": 20, "text": "Хязгаарлалтын хүчин зүйлтэй үед дотооддоо үйлдвэрлэх, гаднаас худалдан авах шийдвэр гаргалтад нөлөөлөх гол хүчин зүйл юу вэ?", "options": [{"letter": "A", "text": "Нийт зардлыг багасгаж байгаа эсэхийг харгалзана"}, {"letter": "B", "text": "Хязгаарлалттай хүчин зүйлийн нөлөөллөөс үүссэн орлогын алдсан боломж нь үйлдвэрлэлийн процессын зардлаас бага байгаа эсэхийг харгалзана."}, {"letter": "C", "text": "Хязгаарлалттай хүчин зүйлийн нөлөөлөл нь гадаад хүчин зүйлээс шалтгаалдаг учир хязгаарлагч хүчин зүйлийг их хэмжээгээр нөөцлөхтэй холбоотой зардлыг харгалзана."}, {"letter": "D", "text": "Борлуулалтын үнийг өсгөж байгаа эсэхийг харгалзана."}], "answer": "A"}, {"num": 21, "text": "Хязгаарлагч хүчин зүйл цорын ганц бол хязгаарлагч хүчин зүйлийг нэгж тус бүрийн боломжит ..
