": "Зардал нь хувьсах болон тогтмол зардлаас бүрдэж байгаа үед ахиуц зардал нь үйлдвэрлэсэн борлуулсан нэмэлт нэгж тус бүрийн хувьсах зардал байна."}], "answer": "A"}, {"num": 7, "text": "Хэрэв бүтээгдэхүүний эрэлтийн өөрчлөлтийн хувь үнийн өсөлтийн хувиас бага бол.... бараа гэнэ.", "options": [{"letter": "A", "text": "Мэдрэмж сайн"}, {"letter": "B", "text": "Төгс мэдрэмжтэй"}, {"letter": "C", "text": "Огт мэдрэмжгүй."}, {"letter": "D", "text": "Мэдрэмж сул"}], "answer": "D"}, {"num": 8, "text": "Дараах нөхцлүүдийн алинд нь байгууллага шинэ бүтээгдэхүүний үнээ багаар тогтоодог вэ?", "options": [{"letter": "A", "text": "Амьдралын мөчлөг богино бүтээгдэхүүнтэй үед."}, {"letter": "B", "text": "Зах зээлд шинэ өрсөлдөгчийг оруулах сонирхолгүй үед."}, {"letter": "C", "text": "Амьдралын мөчлөгийн сүүлийн үе шатуудад үнэ буурна гэж хүлээлттэй үед."}, {"letter": "D", "text": "Богино хугацаанд хөрөнгө оруулалтаа нөхөх хүсэлтэй байгаа үед."}], "answer": "B"}, {"num": 9, "text": "Хэрэв бүтээгдэхүүний эрэлтийн өөрчлөлтийн хувь үнийн өөрчлөлтийн хувиас их бол . . . . . . . . . . бараа гэнэ", "options": [{"letter": "A", "text": "Мэдрэмж сайтай"}, {"letter": "B", "text": "Мэдрэмж муутай"}, {"letter": "C", "text": "Төгс мэдрэмжтэй"}, {"letter": "D", "text": "Мэдрэмжгүй"}], "answer": "A"}, {"num": 10, "text": "Ямар тохиолдолд компанийн ашиг хамгийн өндөр байх вэ?", "options": [{"letter": "A", "text": "Ахиуц орлого = Ахиуц зардал"}, {"letter": "B", "text": "Ахиуц орлого > Ахиуц зардал"}, {"letter": "C", "text": "Ахиуц орлого < Ахиуц зардал"}, {"letter": "D", "text": "Ахиуц орлого = Нийт зардал"}], "answer": "A"}, {"num": 11, "text": "\"А\" барааны үнэ 10%-аар өсөхөд, эрэлт нь 3%-аар буурсан бол тус барааны эрэлтийн мэдрэмжийг тодорхойл.", "options": [{"letter": "A", "text": "Төгс мэдрэмжтэй"}, {"letter": "B", "text": "Мэдрэмж сайтай"}, {"letter": "C", "text": "Мэдрэмж сул"}, {"letter": "D", "text": "Огт мэдрэмжгүй"}], "answer": "C"}, {"num": 12, "text": "Ямар зах зээл дээр олон тооны нийлүүлэгчид төстэй ч ижил биш бүтээгдэхүүнүүд санал болгодог вэ?", "options": [{"letter": "A", "text": "Төгс өрсөлдөөнт"}, {"letter": "B", "text": "Монопол"}, {"letter": "C", "text": "Монопол өрсөлдөөнт"}, {"letter": "D", "text": "Олигопол"}], "answer": "C"}, {"num": 13, "text": "Тусгай захиалгын үнийг тогтоохдоо аж ахуй нэгж үнэ тогтоох ямар стратеги баримтлах вэ?", "options": [{"letter": "A", "text": "Өртөгт үндэслэн үнэ тогтоох"}, {"letter": "B", "text": "Ялгаварт зардлаар үнэ тогтоох"}, {"letter": "C", "text": "Төрөлжсөн бүтээгдэхүүний үнэ тогтоох"}, {"letter": "D", "text": "Нэвтрэх үнэ тогтоох"}], "answer": "B"}, {"num": 14, "text": "Ямар зах зээлийн үед олон тооны нийлүүлэгчид ижил бүтээгдэхүүн худалдаалдаг вэ?", "options": [{"letter": "A", "text": "Монопол зах зээл"}, {"letter": "B", "text": "Монопол өрсөлдөөнт зах зээл"}, {"letter": "C", "text": "Төгс өрсөлдөөнт зах зээл"}, {"letter": "D", "text": "Олигопол зах зээл"}], "answer": "C"}, {"num": 15, "text": "Ахиуц ашгийн аргаар үнэ тогтоохдоо хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Шууд зардлаар тооцсон нэгжийн өртөг + Үнийн нэмэгдлийн хувь"}, {"letter": "B", "text": "Бүрэн шингээлтээр тооцсон нэгжийн өртөг + Үнийн нэмэгдлийн хувь"}, {"letter": "C", "text": "Үйлдвэрлэлийн хувьсах зардал / Үнийн нэмэгдлийн хувь"}, {"letter": "D", "text": "Үйлдвэрлэлийн нийт зардал / Үнийн нэмэгдлийн хувь"}], "answer": "A"}, {"num": 16, "text": "Хэрэглэгчдийн үнэд хандах хандлагыг юу гэх вэ?", "options": [{"letter": "A", "text": "Үнийн мэдрэмж"}, {"letter": "B", "text": "Үнийн таамаглал"}, {"letter": "C", "text": "Бүтээгдэхүүний чанар"}, {"letter": "D", "text": "Бүтээгдэхүүний нэр төрөл"}], "answer": "B"}, {"num": 17, "text": "Хослох барааны үнэ өсөхөд эрэлт хэрхэн өөрчлөгдөх вэ?", "options": [{"letter": "A", "text": "Нэмэгдэнэ"}, {"letter": "B", "text": "Буурна"}, {"letter": "C", "text": "Тогтвортой байна"}, {"letter": "D", "text": "Тооцох боломжгүй"}], "answer": "B"}, {"num": 18, "text": "Эрэлт өсөхөд үнэ өсөх нь .................... юм.", "options": [{"letter": "A", "text": "Нийлүүлэгчийн сонирхол"}, {"letter": "B", "text": "Хэрэглэгчийн сонирхол"}, {"letter": "C", "text": "Эрэлтийн хууль"}, {"letter": "D", "text": "Нийлүүлэлтийн хууль"}], "answer": "C"}, {"num": 19, "text": ".................... үед үнийн өсөлт нь орлогыг бууруулж, үнийн бууралт нь орлогыг нэмэгдүүлдэг.", "options": [{"letter": "A", "text": "Мэдрэмжгүй эрэлт"}, {"letter": "B", "text": "Мэдрэмжтэй эрэлт"}, {"letter": "C", "text": "Төгс мэдрэмжтэй эрэлт"}, {"letter": "D", "text": "Огт мэдрэмжгүй эрэлт"}], "answer": "B"}, {"num": 20, "text": "Ашиг хамгийн их байх үеийн үнийг тооцоход дараах нөхцөлийг хангасан байна.", "options": [{"letter": "A", "text": "P=a-bQ, C = F + VQ үед MR = MC"}, {"letter": "B", "text": "P=a-bQ, C = F + VQ үед MR > MC"}, {"letter": "C", "text": "P=a-bQ, C = F + VQ үед MR < MC"}, {"letter": "D", "text": "P=a-bQ, C = F + vQ үед MR ≠ MC"}], "answer": "A"}, {"num": 21, "text": "Байгууллагын эрэлтэд нөлөөлөх хүчин зүйлсэд: I) Чанар, II) Маркетинг, III) Таамаглал ба хүлээлт, IV) Бүтээгдэхүүний амьдралын мөчлөг", "options": [{"letter": "A", "text": "I зөв, II, III ба IV буруу"}, {"letter": "B", "text": "I, II зөв III ба IV буруу"}, {"letter": "C", "text": "I, II, IV зөв, III буруу"}, {"letter": "D", "text": "I, IV зөв, II, III буруу"}], "answer": "C"}, {"num": 22, "text": "Нэгж бүтээгдэхүүний үнэ тогтоох бодлого гэж .......... хэлнэ.", "options": [{"letter": "A", "text": "Нийт үйлдвэрлэлийн зардал дээр ахиуц ашгаа нэмэхийг"}, {"letter": "B", "text": "Нийт үйлдвэрлэлийн болон борлуулалтын зардал дээр хэвийн ашгаа нэмэхийг"}, {"letter": "C", "text": "Нийт үйлдвэрлэлийн зардал дээр тээврийн зардал, маркетингийн зардлыг нэмэхийг"}, {"letter": "D", "text": "Материалын өртөг дээр бусад зардлаа нэмээд борлуулалтын үнээс хасахыг"}], "answer": "B"}, {"num": 23, "text": "Та шинэ бүтээгдэхүүн зах зээлд нэвтрүүлэхээр төлөвлөж байгаа бөгөөд найз тань танд борлуулалтын анхны үнэд нэвтрэлтийн үнэ барихыг санал болгосон. Дараахаас аль нь нэвтрэлтийн үнийн бодлогыг илэрхийлэх вэ?", "options": [{"letter": "A", "text": "Хамгийн их орлого олохын тулд анхны үнээ зах зээлийн хүчийг ашиглан тогтоодог."}, {"letter": "B", "text": "Анхны борлуулалтын үнэ нь өрсөлдөгчийн үнэтэй ижил байдаг ба ингэснээр зах зээлд ижил байр суурьтай байдаг."}, {"letter": "C", "text": "Их ашиг олохын тулд анхны борлуулалтын үнэ нь өндөр байна."}, {"letter": "D", "text": "Зах зээлийг эзлэхийн тулд анхны борлуулалтын үнэ нь бага байна."}], "answer": "D"}, {"num": 24, "text": "Бараа бүтээгдэхүүний үнийн өөрчлөлтөнд үзүүлж буй эрэлтийн өөрчлөлтийн хэмжигдэхүүнийг ......... гэнэ.", "options": [{"letter": "A", "text": "Үнийн эрэлтээс хамаарах мэдрэмж"}, {"letter": "B", "text": "Эрэлтийн үнээс хамаарах мэдрэмж"}, {"letter": "C", "text": "Мэдрэмжгүй эрэлт"}, {"letter": "D", "text": "Төгс мэдрэмжтэй эрэлт"}], "answer": "B"}, {"num": 25, "text": "Эрэлтийн функцийг тооцоолох буруу алхмыг сонгоно уу?", "options": [{"letter": "A", "text": "Эрэлт 1-тэй тэнцүү байх үнийг олно."}, {"letter": "B", "text": "Үнийн өөрчлөлт ба тоо хэмжээний өөрчлөлтийн харьцааг тооцно."}, {"letter": "C", "text": "Өнөөгийн үнийн түвшин дэх функцээ шалгана."}, {"letter": "D", "text": "Эрэлтийн муруйн тэнцэтгэлээ шалгана."}], "answer": "A"}, {"num": 26, "text": "Эрэлт ба үнийн мэдрэмжтэй холбоотой буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Үнэ буурахад эрэлт өсөж, үнэ өсөхөд эрэлт буурдаг."}, {"letter": "B", "text": "Эрэлтийн үнээс хамаарах мэдрэмж нь 1-ээс их бол мэдрэмжтэй гэж үзнэ."}, {"letter": "C", "text": "Мэдрэмжгүй эрэлтийн үед орлого буурч, зардал өсдөг."}, {"letter": "D", "text": "Төгс мэдрэмжтэй эрэлтийн үед үнийн өсөлт нь орлогыг бууруулдаг."}], "answer": "C"}, {"num": 27, "text": "Худалдан авагчдыг татах зорилгоор нэг барааг өндөр үнээр борлуулахын тулд нөгөө барааг маш бага үнээр борлуулах стратеги нь:", "options": [{"letter": "A", "text": "Төрөлжсөн бүтээгдэхүүний үнэ тогтоолтод ашиглагдана."}, {"letter": "B", "text": "Хосолсон бүтээгдэхүүний үнэ тогтоолтод ашиглагдана."}, {"letter": "C", "text": "Үнийн ялгаварлалын үед ашиглагдана."}, {"letter": "D", "text": "Орлуулагдах бүтээгдэхүүний үнэ тогтоолтод ашиглагдана."}], "answer": "B"}, {"num": 28, "text": "Хэрэглэгчийн төлөхийг хүсэж буй үнэнд суурилан үнэ тогтоох нь:", "options": [{"letter": "A", "text": "Ахиуц ашгийн аргаар үнэ тогтоох"}, {"letter": "B", "text": "Амьдралын мөчлөгөөр үнэ тогтоох"}, {"letter": "C", "text": "Зорилтот өртгийн системээр үнэ тогтоох"}, {"letter": "D", "text": "Ялгаварт зардлаар үнэ тогтоох"}], "answer": "C"}, {"num": 29, "text": "Хэрэглэгчдийн орлогын өсөлт нь бүтээгдэхүүний эрэлтийг нэмэгдүүлдэг бол тус бүтээгдэхүүн нь:", "options": [{"letter": "A", "text": "Дээд зэргийн буюу хэвийн бүтээгдэхүүн"}, {"letter": "B", "text": "Чанар муутай бүтээгдэхүүн"}, {"letter": "C", "text": "Эрэлтийн үнийн мэдрэмж сайтай бүтээгдэхүүн"}, {"letter": "D", "text": "Эрэлтийн үнийн мэдрэмж сул бүтээгдэхүүн"}], "answer": "A"}, {"num": 30, "text": "Нэг удаа ашиг бий болгох боломжтой тусгай захиалгад ямар аргаар үнэ тогтоох вэ?", "options": [{"letter": "A", "text": "Бүрэн өртөгт үндэслэх аргаар"}, {"letter": "B", "text": "Шууд өртөгт үндэслэх аргаар"}, {"letter": "C", "text": "Зорилтот өртгийн аргаар"}, {"letter": "D", "text": "Ялгаварт зардлын аргаар"}], "answer": "D"}, {"num": 31, "text": "Шууд өртөг үндэслэн үнэ тогтоох аргын үед үнэ нь:", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн хувьсах зардал + Үнийн нэмэгдэл"}, {"letter": "B", "text": "Үйлдвэрлэлийн хувьсах зардал + Үйл ажиллагааны хувьсах зардал + Үнийн нэмэгдэл"}, {"letter": "C", "text": "Үйлдвэрлэлийн тогтмол зардал + Үнийн нэмэгдэл"}, {"letter": "D", "text": "Үйлдвэрлэлийн хувьсах зардал + Үйлдвэрлэлийн тогтмол зардал + Үнийн нэмэгдэл"}], "answer": "B"}, {"num": 32, "text": "Үнийн таамаглал гэдэг нь", "options": [{"letter": "A", "text": "Хэрэглэгчдийн үнэнд хандах хандлага"}, {"letter": "B", "text": "Үнийн урьдчилсан таамаглалын нэг хэсэг"}, {"letter": "C", "text": "Үнийн мэдрэмжийг тодорхойлоход хэрэгтэй"}, {"letter": "D", "text": "Өрсөлдөгчийн үнийн ойролцоо түвшин"}], "answer": "A"}, {"num": 33, "text": "Компьютер үйлдвэрлэгч нь бүтэн цагийн боловсрол олгох хэрэглэгчдэдээ урамшуулал өгдөг. Энэ нь дараах үнийн бодлогуудын алинд хамаарах вэ?", "options": [{"letter": "A", "text": "Дээд үнэ тогтоох бодлого"}, {"letter": "B", "text": "Ялгавартай үнийн бодлого"}, {"letter": "C", "text": "Нэвтрэх үнэ тогтоох бодлого"}, {"letter": "D", "text": "Тоо хэмжээний хөнгөлөлт тооцох бодлого"}], "answer": "B"}, {"num": 34, "text": "Бүрэн өртөгт суурилсан үнэ тогтоох аргуудын үед үнийн нэмэгдлийн хувийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "(Үйлдвэрлэлийн зардал+Ашиг)/Үйл ажиллагааны зардал"}, {"letter": "B", "text": "(Үйл ажиллагааны зардал+Ашиг)/Үйлдвэрлэлийн зардал"}, {"letter": "C", "text": "(Хувьсах зардал+Ашиг)/Тогтмол зардал"}, {"letter": "D", "text": "(Тогтмол зардал+Ашиг)/Хувьсах зардал"}], "answer": "B"}, {"num": 35, "text": "Дараахаас аль тохиолдолд хамгийн их ашиг олох сайн үнэ тогтоно гэж үздэг вэ?", "options": [{"letter": "A", "text": "Нийт орлого ба нийт зардлын огтлолцлын цэг дээр"}, {"letter": "B", "text": "Ахиуц орлого ба ахиуц зардлын огтлолцлын цэг дээр"}, {"letter": "C", "text": "Нийт орлого ба ахиуц зардлын огтлолцлын цэг дээр"}, {"letter": "D", "text": "Нийт зардал ба ахиуц орлогын огтлолцлын цэг дээр"}], "answer": "B"}, {"num": 36, "text": "Үнийн өөрчлөлтөөс үл хамааран эрэлт нь өөрчлөгддөггүй бүтээгдэхүүний үнээс хамаарсан эрэлтийн мэдрэмж ямар байх вэ?", "options": [{"letter": "A", "text": "Мэдрэмж сул"}, {"letter": "B", "text": "Мэдрэмж сайтай"}, {"letter": "C", "text": "Төгс мэдрэмжтэй"}, {"letter": "D", "text": "Огт мэдрэмжгүй"}], "answer": "D"}, {"num": 37, "text": "Шууд өртөгт үндэслэн үнэ тогтоохтой холбоотой зөв хариултыг сонгоно уу", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн хувьсах зардал + Үнийн нэмэгдлийн хувь"}, {"letter": "B", "text": "Үйлдвэрлэлийн бус хувьсах зардал + Үнийн нэмэгдлийн хувь"}, {"letter": "C", "text": "Үйлдвэрлэлийн хувьсах зардал + Үйлдвэрлэлийн тогтмол зардал + Үнийн нэмэгдлийн хувь"}, {"letter": "D", "text": "Ахиуц ашиг + Үнийн нэмэгдлийн хувь"}], "answer": "A"}, {"num": 38, "text": "Тогтмол үйлдвэрлэлийн нэмэлт зардлыг бүтээгдэхүүний өртөгт оруулан тооцдог нь ямар үнийн стратеги вэ?", "options": [{"letter": "A", "text": "Бүрэн шингээх өртгийн арга"}, {"letter": "B", "text": "Ахиуц зардлаар үнэ тогтоох"}, {"letter": "C", "text": "Төрөлжсөн байдлаар үнэ тогтоох"}, {"letter": "D", "text": "Нэвтрэх үнэ тогтоох"}], "answer": "A"}, {"num": 39, "text": "Үнэд нөлөөлөх гол хүчин зүйл нь I)үнийн мэдрэмж II)чанар III)Зуучлагч IV)эрэлтийн таамаглал", "options": [{"letter": "A", "text": "I буруу II,III,IV зөв"}, {"letter": "B", "text": "I,II зөв III,IV буруу"}, {"letter": "C", "text": "I Зөв II,III,IV Буруу"}, {"letter": "D", "text": "I,II,III Зөв IV буруу"}], "answer": "D"}, {"num": 40, "text": "Орлуулагдах бүтээгдэхүүний үнэ өсөхөд бусад барааны эрэлт хэрхэн өөрчлөгдөх вэ?", "options": [{"letter": "A", "text": "нэмэгдэнэ"}, {"letter": "B", "text": "буурна"}, {"letter": "C", "text": "өөрчлөгдөхгүй"}, {"letter": "D", "text": "тодорхойлох боломжгүй"}], "answer": "A"}, {"num": 41, "text": "Барааны үнийн өсөлт 6 хувь эрэлтийн бууралт 10 хувь бол барааны эрэлтийн мэдрэмжийг тодорхойлно уу.", "options": [{"letter": "A", "text": "Төгс мэдрэмжтэй"}, {"letter": "B", "text": "Мэдрэмж сайтай"}, {"letter": "C", "text": "Мэдрэмж сул"}, {"letter": "D", "text": "Огт мэдрэмжгүй"}], "answer": "B"}, {"num": 42, "text": "Бүрэн өртөгт суурилан үнэ тогтоох үед үнийн нэмэгдлийн хувийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "(Нийт үйлдвэрлэлийн зардал + Ашигласан капиталын өгөөж) / Нийт үйлдвэрлэлийн зардал"}, {"letter": "B", "text": "(Нийт үйлдвэрлэлийн зардал + Ашигласан капиталын өгөөж) / Нийт үйл ажиллагааны зардал"}, {"letter": "C", "text": "(Нийт үйл ажиллагааны зардал + Ашигласан капиталын өгөөж) / Нийт үйл ажиллагааны зардал"}, {"letter": "D", "text": "(Нийт үйл ажиллагааны зардал + Ашигласан капиталын өгөөж) / Нийт үйлдвэрлэлийн зардал"}], "answer": "D"}, {"num": 43, "text": "А компани шинэ төрлийн бүтээгдэхүүнийг зах зээлд борлуулах гэж байгаа. Бүтээгдэхүүнд хямд үнэ тогтоох стратеги баримтлахаар болсон бол энэ нь дараахаас алийг нь илэрхийлж байна вэ", "options": [{"letter": "A", "text": "Өртөгт суурилж үнэ тогтоох"}, {"letter": "B", "text": "Зах зээлд нэвтрэх үнэ тогтоох"}, {"letter": "C", "text": "Үнийн ялгаварлал"}, {"letter": "D", "text": "Ялгаварт зардлаар үнэ тогтоох"}], "answer": "B"}]}, {"number": 10, "title": "Богино хугацааны шийдвэрүүд", "questions": [{"num": 1, "text": "Материалын ялгаварт зардал нь:", "options": [{"letter": "A", "text": "Материалыг орлуулах боломжтой, агуулахад бэлэн байгаа тохиолдолд бодит үнэ цэн болно."}, {"letter": "B", "text": "Материалыг орлуулах боломжгүй, агуулахад бэлэн байгаа тохиолдолд худалдан авах үнэ болно."}, {"letter": "C", "text": "Материалыг орлуулах боломжгүй, агуулахад бэлэн байгаа тохиолдолд зарах үнэ болон өөр зориулалтаар хэрэглэхэд орлох өртөг хоёрын аль өндөр үнэ болно."}, {"letter": "D", "text": "Зөв хариулт алга."}], "answer": "C"}, {"num": 2, "text": "Машин тоног төхөөрөмж ашиглахтай холбоотой богино хугацааны шийдвэр гаргалтанд дараах зардлуудын аль нь ялгаварт зардал болохгүй вэ?", "options": [{"letter": "A", "text": "Тоног төхөөрөмжийг бусдад түрээслүүлэх"}, {"letter": "B", "text": "Тоног төхөөрөмжийг түрээслэх"}, {"letter": "C", "text": "Хугацааны эцэст зарж борлуулах үнэ"}, {"letter": "D", "text": "Жилийн элэгдлийн зардал"}], "answer": "D"}, {"num": 3, "text": "Дараах богино хугацааны шийдвэр гаргалттай холбоотой ялгаварт зардлыг ашиглана.", "options": [{"letter": "A", "text": "Дотооддоо үйлдвэрлэх болон гаднаас худалдан авах шийдвэр нь хязгаарлалтын хүчин зүйлтэй үед"}, {"letter": "B", "text": "Дотооддоо үйлдвэрлэх болон гаднаас худалдан авах шийдвэр нь хязгаарлалтын хүчин зүйлгүй үед"}, {"letter": "C", "text": "Дээрх бүгд зөв"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "A"}, {"num": 4, "text": "Дараах өгөгдлөөс буруу хариултыг сонго.", "options": [{"letter": "A", "text": "Хэвийн хүчин чадлынхаа хэмжээнд багтааж нэмэлт захиалга авбал ахиуц ашигтайгаа тэнцүү ашиг хүртэх боломжтой"}, {"letter": "B", "text": "Хувилбар хооронд хувьсан өөрчлөгдөх зардлыг ялгаварт зардал гэнэ"}, {"letter": "C", "text": "Хэвийн хүчин чадлаас давсан хэмжээний нэмэлт захиалгатай холбоотой ахиуц орлого нь эерэг утгатай байвал тухайн захиалгыг хүлээн авна"}, {"letter": "D", "text": "Үйл ажиллагаагаа өргөжүүлэх зорилгоор гарсан тогтмол зардлыг ялгаварт зардал гэж үзнэ"}], "answer": "C"}, {"num": 5, "text": "Ялгаварт зардлын тодорхойлолтонд багтах хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Үйл ажиллагаанаас үл хамааран гарсан болон ирээдүйд гарах зардлууд юм."}, {"letter": "B", "text": "Бүтээгдэхүүн үйл ажиллагаанд шингээгдсэн зардал юм."}, {"letter": "C", "text": "Үйл ажиллагааны шийдвэрээс хамааран ирээдүйд гарах өсөн нэмэгдэх зардлууд юм."}, {"letter": "D", "text": "Шийдвэрээс үл хамааран үйл ажиллагаанаас гарах ирээдүйн мөнгөн урсгал хэлбэрээр гарах зардлууд юм."}], "answer": "C"}, {"num": 6, "text": "Богино хугацааны шийдвэр гаргалттай холбоотой үл хамаарах зардал гэдэг нь .................................... юм.", "options": [{"letter": "A", "text": "Ялгаварт зардал"}, {"letter": "B", "text": "Алдагдсан боломжийн өртөг"}, {"letter": "C", "text": "Өнгөрсөн зардал"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "C"}, {"num": 7, "text": "Нэмэлт хувьсах зардал гэдэг нь: (Зөв хариултыг сонго)", "options": [{"letter": "A", "text": "Дотоод үйлдвэрийн хувьсах зардал ба туслан гүйцэтгэгчээс авсан худалдан авалтын зөрүү"}, {"letter": "B", "text": "Дотоод үйлдвэрийн хувьсах зардал дээр туслан гүйцэтгэгчийн гэрээний хувьсах зардал нэмсэн дүн"}, {"letter": "C", "text": "Дотоод үйлдвэрийн хувьсах зардал дээр туслан гүйцэтгэгчийн гэрээний нийт өртгий йн онол хэрэгждэг. Эхний нэгж бүтээгдэхүүн үйлдвэрлэхэд 120 цаг зарцуулдаг. 480 ширхэг бүтээгдэхүүн үйлдвэрлэх үеийн дундаж цагийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Y = 480 * 120^b"}, {"letter": "B", "text": "Y = 120 * 480^b"}, {"letter": "C", "text": "Y = 120 * 480"}, {"letter": "D", "text": "Y = X * 120 * 480"}], "answer": "C"}, {"num": 3, "text": "Сургалтын муруйн онол нь бүтээгдэхүүн үйлдвэрлэлийн ямар үе шат хүртэл үйлчлэх вэ?", "options": [{"letter": "A", "text": "Нэвтрэлтийн үе"}, {"letter": "B", "text": "Өсөлтийн үе"}, {"letter": "C", "text": "Уналтын үе"}, {"letter": "D", "text": "Тогтворжилтын үе"}], "answer": "D"}, {"num": 4, "text": "Дээд ба доод цэгийн аргын үед тогтмол зардлыг тооцохдоо", "options": [{"letter": "A", "text": "Хамгийн их үйлдвэрлэлийн түвшин дэх зардлын дүнгээс хамгийн бага зардлыг хасаж нэгжийн тогтмол зардлаар үржүүлнэ."}, {"letter": "B", "text": "Хамгийн их эсвэл хамгийн бага нийт зардлаас хамгийн их ба бага цэгт харгалзах хувьсах зардлыг хасна."}, {"letter": "C", "text": "Хамгийн их үйлдвэрлэлийн түвшин дэх хамгийн бага зардлын дүнг хасаад нэгжийн хувьсах зардлаар үржүүлнэ."}, {"letter": "D", "text": "Аль нь ч биш."}], "answer": "B"}, {"num": 5, "text": "Сургалтын муруйн тооцооллыг дараах аргаар тооцдог.", "options": [{"letter": "A", "text": "Дээд ба доод цэгийн арга болон хүснэгтийн арга"}, {"letter": "B", "text": "Хүснэгтийн арга болон алгебрийн томъёоны арга"}, {"letter": "C", "text": "Алгебрийн томъёоны арга болон дээд ба доод цэгийн арга"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "B"}, {"num": 6, "text": "Дадлагажих муруйн онолын хязгаарлагдмал байдлын хувьд дараахаас зөвийг сонго. і. Энэ онол нь амьдралд байнга хэрэгжээд байдаггүй. іі. Дадлагажих муруйн онолын тогтворжилтын түвшин амьдралд хэрэгжихгүй байх талтай. ііі. Дадлагажих түвшинг тодорхойлоход хүндрэлтэй байдаг.", "options": [{"letter": "A", "text": "і, іі, ііі"}, {"letter": "B", "text": "і, ііі"}, {"letter": "C", "text": "іі, ііі"}, {"letter": "D", "text": "іі"}], "answer": "A"}, {"num": 7, "text": "Дараах шийдвэр гаргалтуудын алинд нь дадлагажигч муруйн онол ашиглагдахгүй вэ?", "options": [{"letter": "A", "text": "Гэрээт ажлын үнийн саналыг тогтоох"}, {"letter": "B", "text": "Хүрч болох ашгийн түвшнийг тооцох"}, {"letter": "C", "text": "Стандарт өртөг тооцох"}, {"letter": "D", "text": "Нэг нэгжийг үйлдвэрлэхэд зарцуулах нэмэлт зардлыг тооцох"}], "answer": "B"}, {"num": 8, "text": "Дээд ба доод цэгийн аргаар нэгжийн хувьсах зардлыг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Зардлын ялгавар / Үйл явцын түвшний ялгавар"}, {"letter": "B", "text": "Үйл явцын түвшний ялгавар / Зардлын ялгавар"}, {"letter": "C", "text": "Дээд цэг дээрх зардал / Доод цэг дээрх зардал"}, {"letter": "D", "text": "Дээд цэг дээрх үйл явцын түвшин / Доод цэг дээрх үйл явцын түвшин"}], "answer": "A"}, {"num": 9, "text": "Дээд ба доод цэгийн аргыг ямар тохиолдолд ашигладаг вэ?", "options": [{"letter": "A", "text": "Богино хугацааны шийдвэр гаргах үед"}, {"letter": "B", "text": "Хагас хувьсах зардлыг ангилах үед"}, {"letter": "C", "text": "Үйлдэлд суурилан өртөг тооцох аргын үед"}, {"letter": "D", "text": "Хамсарсан зардлыг хамсарсан бүтээгдэхүүн хуваарилах үед"}], "answer": "B"}, {"num": 10, "text": ".......... нь ажиллах хүчний дадлага туршлагаар бүтээмж болон үр ашгийн өсөлтийг хэмждэг.", "options": [{"letter": "A", "text": "Хязгаарлалтын онол"}, {"letter": "B", "text": "Нэгдсэн чанарын удирдлага"}, {"letter": "C", "text": "Дадлагажих муруйн онол"}, {"letter": "D", "text": "Яг цагт нь систем"}], "answer": "C"}, {"num": 11, "text": "Компанийн шинэ бүтээгдэхүүний үйлдвэрлэлд 70 хувийн дадлагажих муруйн онол хэрэгжиж байгаа бол 2 дахь бүтээгдэхүүнийг үйлдвэрлэх цаг анхны бүтээгдэхүүнийг үйлдвэрлэх цагаас хэдэн хувиар бага цагт үйлдвэрлэгдэх вэ?", "options": [{"letter": "A", "text": "70 хувь"}, {"letter": "B", "text": "60 хувь"}, {"letter": "C", "text": "40 хувь"}, {"letter": "D", "text": "30 хувь"}], "answer": "B"}, {"num": 12, "text": "Дадлагажих муруйн тооцооллыг хийх аргад аль нь хамаарах вэ? I. Хүснэгтийн арга II. Алгебрийн арга III. Дээд ба доод цэгийн арга", "options": [{"letter": "A", "text": "I, III"}, {"letter": "B", "text": "II, III"}, {"letter": "C", "text": "I, II"}, {"letter": "D", "text": "I, II, III"}], "answer": "C"}, {"num": 13, "text": "Хагас хувьсах зардлыг ангилах дээд ба доод цэгийн аргын үед зөв хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Үйл ажиллагааны түвшин болон нийт зардлын мэдээллийг ашиглан хувьсах зардлыг тооцдог."}, {"letter": "B", "text": "Дээд цэг дээрх тоо хэмжээг нэгжийн тогтмол зардлаар үржүүлж нийт тогтмол зардлыг тооцно."}, {"letter": "C", "text": "Дээд ба доод цэгийн аргаар зардлыг ангилахдаа магадлалын шинжилгээг ашигладаг."}, {"letter": "D", "text": "Цаг хугацаа их зарцуулдаг ба судалгаа шинжилгээний ажилд зардал их гардаг."}], "answer": "A"}, {"num": 14, "text": "Дээд ба доод цэгийн аргын талаарх мэдэгдлүүдээс аль нь буруу вэ?", "options": [{"letter": "A", "text": "Хамгийн дээд ба хамгийн доод түвшний тоо хэмжээний өөрчлөлтийг авч үздэг."}, {"letter": "B", "text": "Хамгийн дээд ба хамгийн доод түвшинд тооцсон тогтмол зардлын хэмжээ адил байна."}, {"letter": "C", "text": "Зардлын хувийн бус түвшинг авч үздэггүй."}, {"letter": "D", "text": "Нэгж үйл ажиллагааны түвшинд ногдох хувьсах зардлын хэмжээг тодорхойлох боломжтой."}], "answer": "C"}, {"num": 15, "text": "Хагас хувьсах зардлыг ангилах дээд ба доод цэгийн аргын үед буруу ойлголтыг сонгоно уу.", "options": [{"letter": "A", "text": "Хамгийн их ба бага хувьсах зардал бүхий түвшинг сонгоно."}, {"letter": "B", "text": "Зардлын ялгаврыг үйл ажиллагааны түвшний ялгаварт харьцуулсан харьцааг хувьсалтын итгэлцүүр гэнэ."}, {"letter": "C", "text": "Хувьсалтын итгэлцүүрийг түвшин бүрийн үйл ажиллагааны түвшинд үржүүлснийг хувьсах зардал гэнэ."}, {"letter": "D", "text": "Хагас хувьсах зардлаас хувьсах зардлыг хасаад үлдсэн дүнг тогтмол зардал гэнэ."}], "answer": "A"}, {"num": 16, "text": "Дадлагажих муруй онолын дараах тохиолдолд хэрэглэгдэнэ.", "options": [{"letter": "A", "text": "Шинэ эсвэл харьцангуй богино амьдралын мөчлөг бүхий бүтээгдэхүүн үйлдвэрлэл"}, {"letter": "B", "text": "Ажилчид удаан дадлагажиж байгаа тохиолдолд"}, {"letter": "C", "text": "Ажилчдын дадлагажих үйл явц тодорхой түвшинд хүрээд зогсонги болсон үед"}, {"letter": "D", "text": "Нэмэлт захиалгад зориулж үйлдвэрлэхэд нарийн төвөгтэй бүтээгдэхүүнийг их хэмжээгээр үйлдвэрлэх үед"}], "answer": "A"}, {"num": 17, "text": "Холимог зардлыг хуваарилах дээд ба доод цэгийн аргын үед...", "options": [{"letter": "A", "text": "Суурийг хамгийн их ба хамгийн бага утгыг хамаарах зардалтай нь хамт сонгоно"}, {"letter": "B", "text": "Зардал болон суурийн бүх утгуудыг сонгоно"}, {"letter": "C", "text": "Зардал болон суурийн бүх утгуудыг ашиглан шугаман хамаарлын тэгшитгэлийн тусламжтайгаар зардлыг ангилна."}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "A"}]}, {"number": 14, "title": "Төлөвлөлт ба стандарт өртөг", "questions": [{"num": 1, "text": "Дараахаас аль нь төсөв тооцоход хамаарах 'үндсэн стандарт'-ыг тодорхойлж байна вэ?", "options": [{"letter": "A", "text": "Хугацааны туршид өөрчлөгддөггүй стандарт"}, {"letter": "B", "text": "Одоогийн үнийн түвшинд суурилсан стандарт"}, {"letter": "C", "text": "Хэвийн хорогдол, гологдол болон машины сул зогсолтод нөөц байгуулдаггүй онолын түвшинд тогтоогдсон стандарт"}, {"letter": "D", "text": "Хэвийн гологдол, хорогдол болон машины сул зогсолтын нөөцийг багтаасан боловч үр ашигтай үйл ажиллагааны түвшинд тогтоосон стандарт"}], "answer": "A"}, {"num": 2, "text": "Борлуулалтын үнийн стандарт тогтооход нөлөөлөх хүчин зүйлд хамаарахгүй нь аль вэ?", "options": [{"letter": "A", "text": "Дагалдах барааны эрэлт"}, {"letter": "B", "text": "Материал, хөдөлмөр, ҮНЗ"}, {"letter": "C", "text": "Зах зээлийн эрэлт"}, {"letter": "D", "text": "Бүтээгдэхүүний өрсөлдөх чадвар"}], "answer": "A"}, {"num": 3, "text": ". . . . . гэдэг нь материалыг болон тоног төхөөрөмжийг зохистой ашиглан үйлдвэрлэлийг үр ашигтай явуулах үед хүрч болохуйц стандарт юм.", "options": [{"letter": "A", "text": "Онолын стандарт"}, {"letter": "B", "text": "Хэвийн стандарт"}, {"letter": "C", "text": "Хүлээгдэж буй бодит стандарт"}, {"letter": "D", "text": "Практикийн стандарт"}], "answer": "D"}, {"num": 4, "text": "Урт хугацаанд үйл ажиллагааны үр ашиг эсвэл гүйцэтгэлд гарч буй өөрчлөлтийг харуулахад ашигладаг стандарт аль нь вэ?", "options": [{"letter": "A", "text": "Онолын стандарт"}, {"letter": "B", "text": "Практикийн стандарт"}, {"letter": "C", "text": "Хүлээгдэж буй бодит стандарт"}, {"letter": "D", "text": "Хэвийн стандарт"}], "answer": "D"}, {"num": 5, "text": "Үйлдвэрлэлийг үр ашигтай явуулах, тоног төхөөрөмжийг зүй зохистой ажиллуулах үед хүрч болох стандарт аль нь вэ?", "options": [{"letter": "A", "text": "Хүлээгдэж буй бодит стандарт"}, {"letter": "B", "text": "Онолын стандарт"}, {"letter": "C", "text": "Практикийн стандарт"}, {"letter": "D", "text": "Хэвийн стандарт"}], "answer": "C"}, {"num": 6, "text": "Онолын стандарт гэдэг нь: (Зөв хариултыг сонгох)", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн хүчин чадлыг дээд хэмжээнд хүргэх (ямар ч гологдол, хорогдолгүй) стандарт юм"}, {"letter": "B", "text": "Үйлдвэрлэлийг үр ашигтай явуулж, гологдол хорогдлын зарим хэсгийг хүлээн зөвшөөрөх стандарт юм"}, {"letter": "C", "text": "Байгууллагын одоогийн үйл ажиллагааны нөхцөлд суурилдаг стандарт юм"}, {"letter": "D", "text": "Урт хугацаанд өөрчлөгддөггүй стандарт юм"}], "answer": "A"}, {"num": 7, "text": "Стандарт өртөг дараах зүйлд голчлон хэрэглэгдэнэ:", "options": [{"letter": "A", "text": "Бараа материалыг үнэлэх"}, {"letter": "B", "text": "Үйлдвэрийн өртгийг төсөвлөх"}, {"letter": "C", "text": "Хяналтын хэрэгсэл болох"}, {"letter": "D", "text": "Дээрх бүгд E. Аль нь ч биш"}], "answer": "D"}, {"num": 8, "text": "Инфляцийн түвшин өндөр үед аль стандартыг ашиглах нь үр ашигтай байх вэ?", "options": [{"letter": "A", "text": "Он даг бөгөөд гологдол хорогдлын зарим хэсгийг хүлээн зөвшөөрдөг.", "options": [{"letter": "A", "text": "Онолын стандарт"}, {"letter": "B", "text": "Хүрч болохуйц стандарт"}, {"letter": "C", "text": "Одоо мөрдөгдөж буй стандарт"}, {"letter": "D", "text": "Анхан шатны суурь стандарт"}], "answer": "B"}, {"num": 14, "text": "Хэвийн стандартын давуу тал: (Зөв хариултыг сонгох)", "options": [{"letter": "A", "text": "Бусад стандартаасаа илүү түгээмэл хэрэглэгддэг"}, {"letter": "B", "text": "Богино хугацааны үйл ажиллагааны үр ашиг, гүйцэтгэлд гарсан өөрчлөлтүүдийг харуулдаг"}, {"letter": "C", "text": "Инфляцийн түвшин өндөр үед ашиглахад илүү үр дүнтэй"}, {"letter": "D", "text": "Урт хугацааны үйл ажиллагааны үр ашиг, гүйцэтгэлд гарсан өөрчлөлтүүдийг харуулдаг"}], "answer": "D"}, {"num": 15, "text": "Борлуулалтын үнийн стандарт нь дараах зүйлээс хамаардаг. Буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Үйлдвэрлэлийн зардал"}, {"letter": "B", "text": "Таамаглаж буй зах зээлийн эрэлт"}, {"letter": "C", "text": "Бүтээгдэхүүний өрсөлдөх чадвар"}, {"letter": "D", "text": "Тоног төхөөрөмжийн хүчин чадал"}], "answer": "D"}, {"num": 16, "text": "Зардлын элемент бүрийн хувьд тооцоолсон нэгжийн өртгийг ......... гэнэ.", "options": [{"letter": "A", "text": "Зорилтот өртөг"}, {"letter": "B", "text": "Стандарт өртөг"}, {"letter": "C", "text": "Гүйцэтгэлээр өртөг"}, {"letter": "D", "text": "Төсөвлөсөн өртөг"}], "answer": "B"}, {"num": 17, "text": "Стандарт өртөг нь: . . . . . . . . . . . . . . . . . . . . . . . Буруу хариултыг сонгоно уу.", "options": [{"letter": "A", "text": "Зардлын элемент бүрийн хувьд тооцоолсон стандарт нэгжийн өртөг юм."}, {"letter": "B", "text": "Бараа материалыг үнэлэх, үйлдвэрлэлийн өртгийн төсөв бэлтгэхэд ашиглана."}, {"letter": "C", "text": "Олон дамжлага бүхий бүтээгдэхүүнийг бөөнөөр үйлдвэрлэдэг байгууллагад тохиромжтой."}, {"letter": "D", "text": "Иж бүрэн төлөвлөгөө юм."}], "answer": "D"}, {"num": 18, "text": ". . . . . . . . . . . . . . "D", "text": "Одоо мөрдөгдөж буй стандарт"}], "answer": "C"}, {"num": 15, "text": "Төсөв оновчгүй бэлтгэх, стандарт өртөг зохисгүй тооцох шалтгаан аль нь биш вэ?", "options": [{"letter": "A", "text": "Стандарт өртөг ба бодит үр дүнгийн зөрүүд хариуцлага хүлээх чадваргүй удирдлага"}, {"letter": "B", "text": "Хэрэглэгчийн зан төлөв, бүтээгдэхүүнд хандах хандлагаас үүсэх зах зээлийн өөрчлөлтийг тусгаагүй"}, {"letter": "C", "text": "Түүхий эдийн стандарт хэмжээг зарцуулалтаас шалтгаалан үүсэх өөрчлөлтөөр тохируулаагүй"}, {"letter": "D", "text": "Зарим шалтгаанаар нэгж бүтээгдэхүүн үйлдвэрлэхэд зарцуулах стандарт хугацааны өөрчлөлтийг тусгаагүй"}], "answer": "A"}, {"num": 16, "text": "Материалын үнийн хэлбэлзэл үүсэх шалтгаанд хамааралгүйг сонгоно уу", "options": [{"letter": "A", "text": "Худалдан авалтын урамшуулал эдэлсэн"}, {"letter": "B", "text": "Материалаа стандартаас илүү үр ашигтай зарцуулсан"}, {"letter": "C", "text": "Худалдан авалтын урьдчилан тооцоогүй хөнгөлөлт эдэлсэн"}, {"letter": "D", "text": "Тооцоолоогүй үнийн өсөлт үүссэн"}], "answer": "B"}]}, {"number": 18, "title": "Гүйцэтгэлийн удирдлагын мэдээллийн систем", "questions": [{"num": 1, "text": "Роберт Антонигийн шийдвэр гаргах шатлалын гурван түвшинд тодорхойлсны дагуу төлөвлөлт болон хяналтын талаар доор дурдсан: (1) Стратегийн төлөвлөлт гэдэг нь одоо байгаа нөөцийг үр ашигтай, үр дүнтэй ашиглах талаар шийдвэр гаргахтай холбоотой. (2) Үйл ажиллагааны хяналт нь тусгай даалгаврыг үр ашигтай, үр дүнтэй гүйцэтгэх явдлыг баталгаажуулах юм. Дээрхээс аль нь үнэн бэ?", "options": [{"letter": "A", "text": "Зөвхөн 1"}, {"letter": "B", "text": "Зөвхөн 2"}, {"letter": "C", "text": "Аль нь ч биш"}, {"letter": "D", "text": "Дээрх бүгд"}], "answer": "B"}, {"num": 2, "text": "Ажил гүйлгээ боловсруулах систем болон удирдлагын мэдээллийн системийн талаарх дараах ойлголтуудаас аль нь үнэн бэ? (i) Ажил гүйлгээ боловсруулах систем нь байгууллагын гүйлгээг цуглуулж, бүртгэдэг. (ii) Удирдлагын мэдээллийн систем нь байгууллага доторх бүх үйл ажиллагааны мэдээллийг нэгтгэж, нэг систем болгох арга зам юм.", "options": [{"letter": "A", "text": "Зөвхөн 1"}, {"letter": "B", "text": "Зөвхөн 2"}, {"letter": "C", "text": "Аль нь ч биш"}, {"letter": "D", "text": "Дээрх бүгд"}], "answer": "A"}, {"num": 3, "text": "Аж ахуйн нэгж байгууллагын НББ-ийн мэдээллийн системд нөлөөлөхүйц их хэмжээний мэдээллийг агуулдаг нь аль систем вэ?", "options": [{"letter": "A", "text": "ERP"}, {"letter": "B", "text": "EIS"}, {"letter": "C", "text": "ВТР"}, {"letter": "D", "text": "Хаалттай систем"}], "answer": "A"}, {"num": 4, "text": ". . . . . гэдэг нь үйл ажиллагааны гарцаас бий болж байдаг мэдээлэл бөгөөд түүнийг хяналтын зорилгоор ашигладаг.", "options": [{"letter": "A", "text": "Эргэх холбоо"}, {"letter": "B", "text": "Сөрөг холбоо"}, {"letter": "C", "text": "Эерэг холбоо"}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "A"}, {"num": 5, "text": "Төлөвлөлт гэдэг нь", "options": [{"letter": "A", "text": "Олон төрлийн хувилбаруудаас сонголт хийхийг хэлнэ."}, {"letter": "B", "text": "Ирээдүйн үйл ажиллагаагаа боловсруулахыг хэлнэ."}, {"letter": "C", "text": "Үйл ажиллагааны хяналтын үр дүнг баталгаажуулах үйл явц юм."}, {"letter": "D", "text": "Аль нь ч биш"}], "answer": "B"}, {"num": 6, "text": "Логик нэвтрэлтийн систем нь нэвтрэлт шаардагдсан үед дараах үйл ажиллагааг гүйцэтгэнэ.", "options": [{"letter": "A", "text": "Хэрэглэгчийн эрхийн шалгалт"}, {"letter": "B", "text": "Хэрэглэгчийн биеийн байцаалт"}, {"letter": "C", "text": "Хэрэглэгчийн байдлын баталгаажуулалт"}, {"letter": "D", "text": "Дээрх бүгд зөв"}], "answer": "D"}, {"num": 7, "text": "Аж ахуйн нэгжийн гол үйл явцыг нэгтгэхээр зааварчлагдсан модулын програм хангамжийн багцыг . . . . . гэнэ.", "options": [{"letter": "A", "text": "Удирдлагын мэдээллийн систем"}, {"letter": "B", "text": "Гүйцэтгэх удирдлагын мэдээллийн систем"}, {"letter": "C", "text": "Байгууллагын нөөц төлөвлөлтийн систем"}, {"letter": "D", "text": "Ажил гүйлгээ боловсруулалтын , "text": "Шууд холбоотой хяналт"}, {"letter": "D", "text": "Эерэг холбооны хяналт"}], "answer": "C"}, {"num": 14, "text": "Тодорхой даалгавар үр дүнтэй, үр ашигтай биелэгдсэн эсэхийг баталгаажуулах үйл явцыг .......... гэнэ.", "options": [{"letter": "A", "text": "Удирдлагын хяналт"}, {"letter": "B", "text": "Үйл ажиллагааны хяналт"}, {"letter": "C", "text": "Стратеги төлөвлөгөө"}, {"letter": "D", "text": "Стратеги шийдвэр"}], "answer": "B"}, {"num": 15, "text": ".......... нь удирдлагууд аж ахуйн нэгжийн зорилтыг биелүүлэхэд ашиглаж байгаа нөөц нь үр дүнтэй болон үр ашигтайгаар зарцуулагдаж байгаа эсэхийг хянадаг үйл явц юм.", "options": [{"letter": "A", "text": "Удирдлагын хяналт"}, {"letter": "B", "text": "Стратегийн төлөвлөлт"}, {"letter": "C", "text": "Удирдлагын нягтлан бодох бүртгэл"}, {"letter": "D", "text": "Үйл ажиллагаа боловсруулалтын систем"}], "answer": "A"}, {"num": 16, "text": "......... нь гадны хүрээлэн буй орчноос тусгаарлагдсан, мэдээлэл нь хүрээлэн буй орчноос ирдэггүй, бас гадагшаа мэдээлэл тараагддаггүй систем юм.", "options": [{"letter": "A", "text": "Хаалттай систем"}, {"letter": "B", "text": "Нээлттэй систем"}, {"letter": "C", "text": "Дотогш систем"}, {"letter": "D", "text": "Гүйцэтгэлийн систем"}], "answer": "A"}, {"num": 17, "text": "Засгийн Газрын байгууллагуудын гаргаж өгөх шаардлагагүй мэдээлэл аль нь вэ?", "options": [{"letter": "A", "text": "Санхүүгийн статистикүүд"}, {"letter": "B", "text": "Нийгмийн чиг хандлага"}, {"letter": "C", "text": "Эдийн засгийн чиг хандлага"}, {"letter": "D", "text": "Хэрэглэгчийн зан төлвийн чиг хандлага"}], "answer": "D"}, {"num": 18, "text": "Тактикийн төлөвлөлтийг сонгоно уу.", "options": [{"letter": "A", "text": "Богино хугацааны төлөвлөлт"}, {"letter": "B", "text": "Дунд хугацааны төлөвлөлт"}, {"letter": "C", "text": "Үйл ажиллагааны төлөвлөлт"}, {"letter": "D", "text": "Стратеги төлөвлөлт"}], "answer": "B"}, {"num": 19, "text": "Мэдээллийн үнэ цэнэтэй холбоотой зөв хариултыг сонгоно уу?", "options" 4, "text": "Доорх өгүүлбэрүүд нь мэдээллийн системийн талаарх бөгөөд аль нь үнэн болохыг тодорхойлно уу. і. Санал хүсэлт нь мэдээллийн системээс боловсруулагдсан мэдээлэл ба менежментийн зүгээс системд нэмэлт өгөгдлийг хянах арга хэмжээ авахад ашиглагддаг. іі. Жишиг тогтоох мэдээллийг дотоод болон гадаад эх үүсвэрээс авч болно.", "options": [{"letter": "A", "text": "Зөвхөн і"}, {"letter": "B", "text": "Зөвхөн іі"}, {"letter": "C", "text": "Аль нь ч биш"}, {"letter": "D", "text": "і ба іі"}], "answer": "D"}, {"num": 5, "text": "Дараах мэдээллүүдээс аль нь хоёрдогч мэдээлэлд хамаарах вэ?", "options": [{"letter": "A", "text": "Хэрэглээний үнийн индекс."}, {"letter": "B", "text": "Компанийн борлуулалтын түүвэр судалгаа."}, {"letter": "C", "text": "Компанийн хэрэглэгчдийн сэтгэл ханамжийн судалгаа."}, {"letter": "D", "text": "Зах зээлийн судалгаа."}], "answer": "A"}, {"num": 6, "text": "Удирдлагын мэдээллийн системийн гол зорилго нь:", "options": [{"letter": "A", "text": "Компанийн стратеги төлөвлөлт, хяналт болон шийдвэр гаргалтыг дэмжих"}, {"letter": "B", "text": "Татварын байгууллагад тайлант хугацааны татварын өглөгийг үнэн зөв тооцож, тайлагнах"}, {"letter": "C", "text": "Санхүүгийн тайлангийн мэдээллийг үнэн зөв тайлагнаж, толилуулах"}, {"letter": "D", "text": "Санхүүгийн тайланд шаардлагатай мэдээлэл, үр дүнг тооцоолох"}], "answer": "A"}, {"num": 7, "text": "Дараахаас аль нь удирдлагын мэдээллийн системийн зорилго биш вэ?", "options": [{"letter": "A", "text": "Компанийн шийдвэр гаргалтыг дэмжих"}, {"letter": "B", "text": "Компанийн хяналтыг дэмжих"}, {"letter": "C", "text": "Санхүүгийн тайланд шаардлагатай мэдээлэл үр дүнг тооцоолох"}, {"letter": "D", "text": "Компанийн стратеги төлөвлөлтийг дэмжих"}], "answer": "C"}, {"num": 8, "text": "Мэдээллийг бий болгосон эх сурвалжаас нь хамааруулан .................... гэж ангилна.", "options": [{"letter": "A", "text": "Анхдагч ба хоёрдогч"}, {"letter": "B", "text": "Гадаад ба дотоод"}, {"letter": "C", "text": "Тоон ба чанарын"}, {"letter": "D", "text": "Санхүүгийн болон санхүүгийн бус"}], "answer": "A"}, {"num": 9, "text": "Хоёрдогч мэдээллийн хэрэглээний сул тал нь .................... Ⅰ. Зардал Ⅱ. Үнэн зөв байдал Ⅲ. Мэдээллийн хамааралтай байдал", "options": [{"letter": "A", "text": "Ⅰ зөв, Ⅱ, Ⅲ буруу"}, {"letter": "B", "text": "Ⅰ, Ⅱ зөв, Ⅲ буруу"}, {"letter": "C", "text": "Ⅰ, Ⅱ, Ⅲ зөв"}, {"letter": "D", "text": "Ⅰ, Ⅱ, Ⅲ буруу"}], "answer": "C"}, {"num": 10, "text": "Дараах өгөгдлөөс аль нь байгууллагын дотоод мэдээллийн зардал болох вэ?", "options": [{"letter": "A", "text": "Шууд бус нэвтрэлтийн зардал"}, {"letter": "B", "text": "Шууд хайлтын зардал"}, {"letter": "C", "text": "Дэд бүтцийн зардал"}, {"letter": "D", "text": "Мэдээллийн үр нөлөөгүй хэрэглээний зардал"}], "answer": "D"}, {"num": 11, "text": "Онлайн өгөгдлийн сан дахь захиалга, сэтгүүл, үйлчилгээний захиалга, татаж авах төлбөрүүд зэрэг нь гадаад мэдээллийг олж авах зардлын ......... ангилалд хамаарна.", "options": [{"letter": "A", "text": "Шууд хайлтын зардал"}, {"letter": "B", "text": "Шууд бус нэвтрэлтийн зардал"}, {"letter": "C", "text": "Удирдлагын зардал"}, {"letter": "D", "text": "Цагийн хулгайлалт"}], "answer": "A"}, {"num": 12, "text": "Хоёрдогч мэдээллийн хэрэглээний сул тал аль нь биш вэ?", "options": [{"letter": "A", "text": "Үнэн зөв байдал"}, {"letter": "B", "text": "Нэг талыг илүүд үзэх"}, {"letter": "C", "text": "Боломжит байдал"}, {"letter": "D", "text": "Цаг хугацаа"}], "answer": "D"}, {"num": 13, "text": "Дараахаас аль нь хайлтын зардлыг багасгах вэ?", "options": [{"letter": "A", "text": "Вирусны программ"}, {"letter": "B", "text": "Хамгаалалтын хана"}, {"letter": "C", "text": "Хоёрдогч мэдээлэл"}, {"letter": "D", "text": "Интернет"}], "answer": "D"}, {"num": 14, "text": ". . . . . . . . . . . . . . нь удирдлагын мэдээллийн системээс өгөгдөл хүлээн авч үүнийг гадны эх үүсвэр дэх мэдээлэлтэй холбох боломжийг олгодог.", "options": [{"letter": "A", "text": "Стратеги төлөвлөлт"}, {"letter": "B", "text": "Гүйцэтгэлийн мэдээллийн систем"}, {"letter": "C", "text": "Үйл ажиллагааны хяналт"}, {"letter": "D", "text": "Удирдлагын хяналт"}], "answer": "B"}, {"num": 15, "text": "Удирдлагын мэдээллийн дотоод эх үүсвэрт хамааралгүйг сонгоно уу.", "options": [{"letter": "A", "text": "Менежер болон ажилчдын хоорондох мэдээллийн албан бус харилцаа"}, {"letter": "B", "text": "Хэрэглэгчийн худалдан авалтын хандлага болон зах зээлийн судалгаа"}, {"letter": "C", "text": "Машины хүчин чадал, материалын шилжилт хөдөлгөөн, боловсон хүчний талаарх мэдээлэл"}, {"letter": "D", "text": "Бараа материалын захиалга, хүлээн авалт, буцаалт зэргийг агуулсан нийлүүлэгчдийн талаарх мэдээлэл"}], "answer": "B"}, {"num": 16, "text": "Удирдлагын мэдээллийн эх үүсвэр ба удирдлагын тайлантай холбоотой өгүүлбэрүүдээс бурууг сонгоно уу?", "options": [{"letter": "A", "text": "Хэвлэл мэдээлэл нь үргэлж найдвартай байдаг."}, {"letter": "B", "text": "Ихэнх хяналтууд нь дотоод мэдээллийн хариу эргэлтээр дамжиж гүйцэтгэгддэг."}, {"letter": "C", "text": "Гадаад мэдээллийн олон эх үүсвэрүүд байдаг."}, {"letter": "D", "text": "Дотоод мэдээллийн нэгэн хэвийн ба нэгэн хэвийн биш мэдээллийн тайланд хяналт хэрэгтэй байдаг."}], "answer": "A"}, {"num": 17, "text": "Гадаад мэдээллийг олж авахтай холбоотой гарч буй “Маркетингийн судалгааны зардал” нь зардлын аль бүлэгт хамаарах вэ?", "options": [{"letter": "A", "text": "Шууд хайлтын зардал"}, {"letter": "B", "text": "Шууд бус нэвтрэлтийн зардал"}, {"letter": "C", "text": "Дэд бүтцийн зардал"}, {"letter": "D", "text": "Удирдлагын зардал"}], "answer": "A"}, {"num": 18, "text": "Дараахаас аль нь хоёрдогч мэдээллийн хэрэглээний давуу тал мөн бэ?", "options": [{"letter": "A", "text": "Хоёрдогч мэдээлэл нь зарим тодорхой бүтээгдэхүүний хэсэгт байхгүй байж болно."}, {"letter": "B", "text": "Анхдагч судалгаа хийлгүйгээр тухайн мэдээлэл нь асуудлыг шийдвэрлэх боломжтой"}, {"letter": "C", "text": "Хоёрдогч мэдээллийн үнэн зөв байдлыг шалгаж үзэх шаардлагатай байдаг."}, {"letter": "D", "text": "Хоёрдогч мэдээлэл нь судалгааны зорилготой хамааралгүй байж болно."}], "answer": "B"}, {"num": 19, "text": "Аль нь байгууллагын дотоод мэдээллийг олж авахтай холбоотой зардал вэ?", "options": [{"letter": "A", "text": "Менежментийн зардал"}, {"letter": "B", "text": "Дэд бүтцийн зардал"}, {"letter": "C", "text": "Процессын зардал"}, {"letter": "D", "text": "Борлуулалтын зардал"}], "answer": "C"}, {"num": 20, "text": "Дараахаас аль нь шууд бус нэвтрэлтийн зардалд хамаарахгүй вэ?", "options": [{"letter": "A", "text": "Сэтгүүл үйлчилгээний захиалга"}, {"letter": "B", "text": "Мэдээллийн амжилтгүй хайлтад зарцуулсан хугацаа"}, {"letter": "C", "text": "Дуураймал үнэн зөв байдал, орон тооны цомхотгол"}, {"letter": "D", "text": "Дуураймал үнэн зөв байдлыг хайхаар оролдсон хугацаа"}], "answer": "A"}, {"num": 21, "text": "Дотоод мэдээлэл боловсруулах шууд бус зардал нь:", "options": [{"letter": "A", "text": "Нэгээс илүү аргаар цуглуулагдсан ижил мэдээлэл"}, {"letter": "B", "text": "Удирдлагын мэдээллийн системд мэдээлэл оруулахад ажилчдын зарцуулж буй хугацаа"}, {"letter": "C", "text": "Цаг бүртгэлд зарцуулж буй ажилчдын хугацаа"}, {"letter": "D", "text": "Цахим шошго болон сканерийн хэрэглээ"}], "answer": "A"}]}, {"number": 20, "title": "Бизнесийн байгууллагын гүйцэтгэлийн хэмжүүр", "questions": [{"num": 1, "text": "Компанийн сүүлийн хоёр жилийн борлуулалт ба борлуулсан бүтээгдэхүүний өртөг нь өөрчлөгдөөгүй байна. Дараах мэдээлэл өгөгдсөн байв: Хамгийн сүүлийн жилд компанийн гүйцэтгэлийн талаар доор дурдсан: (i) Үйлчлүүлэгчид төлбөрөө хийхэд илүү удаан хугацаа зарцуулсан нь компанийн эргэлтийн харьцааг буурахад нөлөөлсөн байх талтай. (ii) Бараа материалын түвшин буурснаар компанийн түргэн хөрвөх хөрөнгийн харьцаа буурахад нөлөөлсөн байх талтай. Дээрхээс аль нь үнэн бэ?", "options": [{"letter": "A", "text": "Зөвхөн (i)"}, {"letter": "B", "text": "Зөвхөн (ii)"}, {"letter": "C", "text": "Дээрх бүгд үнэн"}, {"letter": "D", "text": "(i), (ii) –ийн аль нь ч биш"}], "answer": "D"}, {"num": 2, "text": "А компани хэрэглэгчдийн санал гомдол болон асуултад хариулдаг дуудлагын төвтэй. Компани дуудлага хийх дундаж хугацаа болон хэрэглэгчидтэй хэдэн удаа дуудлага хийсэн үзүүлэлтүүдийг илүүд авч үздэг. Тэнцвэрт үнэлгээний систем аргын дагуу хэрэглэгчидтэй холбогдох дуудлага хийх тоог багасгахыг зорилт болгон тавьсан. Энэхүү зорилт нь дараах үзүүлэлтүүдийн алинд хамаарах вэ?", "options": [{"letter": "A", "text": "Хэрэглэгчийн үзүүлэлт"}, {"letter": "B", "text": "Санхүүгийн үзүүлэлт"}, {"letter": "C", "text": "Шинэчлэл ба сургалтын үзүүлэлт"}, {"letter": "D", "text": "Дотоод үйл ажиллагааны үзүүлэлт"}], "answer": "D"}, {"num": 3, "text": "Гүйцэтгэлийн удирдлагын “Тэнцвэрт үнэлгээний систем” аргын дагуу дараахаас аль нь хэрэглэгчийн төлөв байдлын гүйцэтгэлийг хэмжих үзүүлэлт вэ?", "options": [{"letter": "A", "text": "Бүтээгдэхүүний нэр төрлийг нэмэгдүүлэх"}, {"letter": "B", "text": "Хэрэглэгчдийн захиалга хийх давтамжийн хувь"}, {"letter": "C", "text": "Борлуулалтын төлөөлөгчийн хамгийн их захиалга авсан тоо"}, {"letter": "D", "text": "Захиалга хийх үйл явцын хурд"}], "answer": "B"}, {"num": 4, "text": "Үйлдвэрлэлд зарцуулсан нөөцөөс хамгийн их гарц бий болгосныг . . . . . . . . . . гэнэ.", "options": [{"letter": "A", "text": "Нөөцийн үр ашигтай зарцуулалт"}, {"letter": "B", "text": "Нөөцийн үр дүнтэй зарцуулалт"}, {"letter": "C", "text": "Нөөцийн өгөөж"}, {"letter": "D", "text": "Нөөцийн зохистой хуваарилалт"}], "answer": "A"}, {"num": 5, "text": "Байгууллагын ажилтнуудын хийж буй олон төрлийн ажил, хэрэглэгчдийн санал хүсэлтэд хариу өгч буй байдал зэрэг нь бүтцийн элементийн аргын аль гүйцэтгэлийн хэмжээсний шалгуур болох вэ?", "options": [{"letter": "A", "text": "Санхүүгийн гүйцэтгэл"}, {"letter": "B", "text": "Өрсөлдөх чадвар"}, {"letter": "C", "text": "Үйлчилгээний чанар"}, {"letter": "D", "text": "Уян хатан байдал"}], "answer": "D"}, {"num": 6, "text": "Байгууллага нь үйлчлүүлэгчдийн хэрэгцээг хангахын тулд дараах гүйцэтгэлийн хэмжүүри онгоно уу. I. Толгой компанийн хөрөнгө болон түүний хяналтад байдаг хөрөнгө оруулалтын төвийн (Х.О.Т) хөрөнгө нь салбарын гүйцэтгэлийн тооцоонд багтахгүй. II. Х.О.Т нь толгой компанитайгаа холбоотой хөрөнгө оруулалт хийсэн бол тэдгээрийн хөрөнгийг хөрөнгө оруулалтын өгөөжийн тооцоонд оруулна. III. Х.О.Т-ийн менежерийн гүйцэтгэлийг үнэлэхдээ үйлчилгээний хэлтэс ба төв компанийн ХОТ-д хамаарахаас бусад зардлыг багтаахгүй. IV. Х.О.Т-ийн гүйцэтгэлийг үнэлэхэд ерөнхий үйлчилгээ болон төв газрын зардлыг оруулан тооцох боломжтой.", "options": [{"letter": "A", "text": "I, II, III"}, {"letter": "B", "text": "II, III, IV"}, {"letter": "C", "text": "I, III, IV"}, {"letter": "D", "text": "I, II, III, IV"}], "answer": "D"}, {"num": 9, "text": "Хөрөнгө оруулалтын төвийн гүйцэтгэлийг хэмжих зарчим нь:", "options": [{"letter": "A", "text": "Хэлбэлзлийн шинжилгээ хийх"}, {"letter": "B", "text": "Орлогын түвшнийг тодорхойлох"}, {"letter": "C", "text": "Үлдэгдэл орлогыг тооцоолох"}, {"letter": "D", "text": "Ахиуц ашгийг тооцоолох"}], "answer": "C"}, {"num": 10, "text": "Нийлүүлэгч салбарын ахиуц зардлын нийт дүн ба шилжүүлсэн бүтээгдэхүүн үйлчилгээний алдагдсан боломжийн өртгийг .......... харуулна.", "options": [{"letter": "A", "text": "Илүүдэл хүчин чадал"}, {"letter": "B", "text": "Хамгийн дээд хязгаар"}, {"letter": "C", "text": "Хамгийн доод хязгаар"}, {"letter": "D", "text": "Үлдэгдэл орлого"}], "answer": "C"}, {"num": 11, "text": "Үлдэгдэл орлоготой холбоотой буруу ойлголтыг тэмдэглэнэ үү?", "options": [{"letter": "A", "text": "Төвлөрсөн бус бүтэцтэй холбоотой зан төлөвийн асуудлаас зайлсхийх боломж олгоно"}, {"letter": "B", "text": "Хөрөнгө оруулалтын төвийн гүйцэтгэлийг хэмжинэ"}, {"letter": "C", "text": "Капиталын өртөг нь зээлийн хүүний зардал эсвэл капиталын жинлэсэн дундаж өртөг байна"}, {"letter": "D", "text": "Хөрөнгө оруулалтын төвүүдийн хоорондох харьцуулалт хийхэд ашиглана"}], "answer": "D"}, {"num": 12, "text": "Хүчин чадал хүрэлцээтэй байгаа үед дотоод үнэ тогтоох доод үнэ нь:", "options": [{"letter": "A", "text": "Нэгжийн хувьсах зардал"}, {"letter": "B", "text": "Нэгжийн хувьсах зардал + Нэгжид ногдох тогтмол зардал"}, {"letter": "C", "text": "Нэгжийн хувьсах зардал + Зорилтот ашиг"}, {"letter": "D", "text": "Нэгжийн хувьсах зардал + Нэгжид ногдох тогтмол зардал + Зорилтот ашиг"}], "answer": "A"}, {"num": 13, "text": "Аль хариуцлагын төвийн гүйцэтгэлийг \"үлдэгдэл орлого\" гэсэн үзүүлэлтээр үнэлдэг вэ?", "options": [{"letter": "A", "text": "Өртгийн төв"}, {"letter": "B", "text": "Орлогын төв"}, {"letter": "C", "text": "Ашгийн төв"}, {"letter": "D", "text": "Хөрөнгө оруулалтын төв"}], "answer": "D"}, {"num": 14, "text": "Менежерийн хяналт хянагдахуйц зардал, борлуулалтын үнэ бол .........", "options": [{"letter": "A", "text": "Ашгийн төв"}, {"letter": "B", "text": "Орлогын төв"}, {"letter": "C", "text": "Зардлын төв"}, {"letter": "D", "text": "Хөрөнгө оруулалтын төв"}], "answer": "A"}, {"num": 15, "text": "Хөрөнгө оруулалтын өгөөжийг хэрхэн тооцох вэ?", "options": [{"letter": "A", "text": "Борлуулалтын орлого / Нийт хөрөнгө"}, {"letter": "B", "text": "Нийт ашиг / Ашиглагдсан капитал"}, {"letter": "C", "text": "Хүү татварын өмнөх ашиг / ашиглагдсан капитал"}, {"letter": "D", "text": "Ахиуц ашиг / Ашиглагдсан капитал."}], "answer": "C"}, {"num": 16, "text": "Дараах өгөгдлөөс аль нь хөрөнгө оруулалтын өгөөжийг өсгөх вэ? 1. Өр төлбөрийг өсгөх 2. Хүүгийн төлбөрийг бууруулах 3. Бүх төслүүдийг ӨҮЦ-р хүлээн авах 4. Хуучин машин тоног төхөөрөмжөө ашиглах", "options": [{"letter": "A", "text": "2, 3"}, {"letter": "B", "text": "1, 2, 4"}, {"letter": "C", "text": "1, 4"}, {"letter": "D", "text": "3, 4"}], "answer": "C"}, {"num": 17, "text": "Хэсэгчлэл гэдэг нь аж ахуйн нэгж нь салбар нэгжүүдэд хуваагдахыг илэрхийлнэ.", "options": [{"letter": "A", "text": "Үнэн"}, {"letter": "B", "text": "Худал"}], "answer": "A"}, {"num": 18, "text": "Дотоод үнэ бүрдүүлэлтийн бодлоготой холбоотой асуудлуудаас буруу хариуг сонгоно уу", "options": [{"letter": "A", "text": "Дотоод үнэ нь салбарын бие даасан байдлыг дэмжих нэг арга юм."}, {"letter": "B", "text": "Дотоод үнэ тогтоох хамгийн доод хязгаар нь зөвхөн алдагдсан боломжийн өртөг байна."}, {"letter": "C", "text": "Дотоод үнэ тогтоох хамгийн дээд хязгаар нь хүлээн авагч салбарын барааг гаднаас худалдан авах зах зээлийн үнэ"}, {"letter": "D", "text": "Зах зээлийн үнэд суурилсан дотоод үнэ тогтоохын сул тал нь зах зээлийн үнэ нь түр зуурынх байдаг."}], "answer": "B"}, {"num": 19, "text": "Дараахаас аль нь ашгийн төвийн онцлог шинж вэ?", "options": [{"letter": "A", "text": "Төвийн менежер нь орлого, зардлыг хянах боломжтой байдаг."}, {"letter": "B", "text": "Ашгийн төв нь орлого бүрдүүлэх, зардлыг хянах, хөрөнгийн өгөөжийг бий болгох үүрэгтэй."}, {"letter": "C", "text": "Ашгийн төвийг үлдэгдэл орлогыг ашиглан үнэлэх боломжтой."}, {"letter": "D", "text": "Ашгийн төвийг бусад хөрөнгө оруулалтын төвүүдтэй харьцуулж үнэлэх боломжтой."}], "answer": "A"}, {"num": 20, "text": "Хариуцлагын төвүүдийг хариуцлага хүлээх байдлаар нь эрэмбэлвэл аль нь зөв бэ?", "options": [{"letter": "A", "text": "хөрөнгө оруулалтын төв, зардлын төв, ашгийн төв."}, {"letter": "B", "text": "зардлын төв, хөрөнгө оруулалтын төв, ашгийн төв."}, {"letter": "C", "text": "зардлын төв, ашгийн төв, хөрөнгө оруулалтын төв."}, {"letter": "D", "text": "хөрөнгө оруулалтын төв, ашгийн төв, зардлын төв."}], "answer": "C"}, {"num": 21, "text": "Хөрөнгө оруулалтын өгөөжтэй холбоотой буруу хариултыг тэмдэглэнэ үү.", "options": [{"letter": "A", "text": "Хөрөнгө оруулалтын төвийн гүйцэтгэлийн үр дүнг хөрөнгө оруулалтын өгөөж ба үлдэгдэл орлогоор хэмжинэ."}, {"letter": "B", "text": "Хөрөнгө оруулалтын өгөөжийг тооцохдоо хүү болон татварын өмнөх ашгийг ашигласан капиталд харьцуулж тооцно."}, {"letter": "C", "text": "Хөрөнгө оруулалтын өгөөж нь төсөвлөсөн үр дүнг үнэлэх үндсэн хэмжүүр болно."}, {"letter": "D", "text": "Хөрөнгө оруулалтын өгөөж нь байнгын капитал болон хөрөнгийн үр ашигтай зарцуулалтаас хамаарна."}], "answer": "C"}, {"num": 22, "text": "Хариуцлагын бүртгэлийн дараах төвүүдээс аль төвийн гүйцэтгэлийг хэлбэлзлийн шинжилгээгээр үнэлдэг вэ?", "options": [{"letter": "A", "text": "Ахиуц ашгийн төв"}, {"letter": "B", "text": "Хөрөнгө оруулалтын төв"}, {"letter": "C", "text": "Өртгийн төв"}, {"letter": "D", "text": "Ашгийн төв"}], "answer": "C"}, {"num": 23, "text": "Компани 2 хэлтэстэй. Хэлтэс А бүтээгдэхүүн үйлдвэрлэж тэдгээрийг хэлтэс Б рүү шилжүүлдэг ба гадагш борлуулдаг. Хэлтэс А бүтээгдэхүүнээ борлуулах гадаад зах зээл байгаа ба хэлтэс Б тэрхүү гадаад зах зээлээс бүтээгдэхүүн худалдан авах боломжтой. Дараахаас аль нь хамгийн доод дотоод шилжүүлгийн үнийг тодорхойлох вэ?", "options": [{"letter": "A", "text": "А хэлтсийн ахиуц зардал дээр А хэлтсийн алдагдсан боломжийн өртөг нэмэх"}, {"letter": "B", "text": "А хэлтсийн ахиуц зардлаас А хэлтсийн алдагдсан боломжийн өртгийг хасах"}, {"letter": "C", "text": "Б хэлтэс рүү борлуулсан цэвэр ахиуц орлогын доод хэмжээ ба гаднаас худалдан авах үнийн аль багаар"}, {"letter": "D", "text": "Б хэлтэс рүү борлуулсан цэвэр ахиуц орлогын дээд хэмжээ ба гаднаас худалдан авах үнийн аль ихээр"}], "answer": "A"}, {"num": 24, "text": "Үлдэгдэл орлогын томьёо аль нь вэ?", "options": [{"letter": "A", "text": "ХТӨА+ ашиглагдсан капитал * Капиталын өртөг"}, {"letter": "B", "text": "ХТӨА- ашиглагдсан капитал * Капиталын өртөг"}, {"letter": "C", "text": "ХТӨА- ажлын капитал * Капиталын өртөг"}, {"letter": "D", "text": "ХТӨА- ашиглагдсан капитал * хөрөнгө оруулалтын өгөөж"}], "answer": "B"}, {"num": 25, "text": "Аль нь хөрөнгө оруулалтын өгөөжийг хэмжих арга вэ?", "options": [{"letter": "A", "text": "Элэгдлийн дараах ашиг буюу байнгын капиталын цэвэр дүнгээр тооцох"}, {"letter": "B", "text": "Оруулсан капиталын үлдэгдлээр тооцох"}, {"letter": "C", "text": "Элэгдлийн дараах ашиг буюу ашиглагдсан капиталын нийт дүнгээр тооцох"}, {"letter": "D", "text": "A ба C хоёулаа"}], "answer": "D"}, {"num": 26, "text": "Нэг хэлтсээс нөгөө хэсэгт эсвэл группий const mixedQuestions=T.flatMap(t=>t.questions.map(x=>({...x,topicNo:t.number,sourceTopic:t.title})));

let ti=0,qi=0,reveal=false,filter='all',feedbackVisible=true;const S=T.map(t=>t.questions.map(()=>({pick:null,checked:false,correct:false})));const $=id=>document.getElementById(id);
function topic(){return T[ti]}function q(){return topic().questions[qi]}function st(){return S[ti][qi]}
function tally(){let a=S[ti],done=a.filter(x=>x.checked).length,correct=a.filter(x=>x.checked&&x.correct).length;return{done,correct}}
function globalTally(){let a=S.flat(),d=a.filter(x=>x.checked).length,c=a.filter(x=>x.checked&&x.correct).length;return{d,c}}

function render(){let t=topic(),item=q(),s=st(),n=t.questions.length,sc=tally();$('topicSelect').value=String(ti);$('topicHeading').textContent=`${t.number===23?'ХОЛИМОГ ТЕСТ':'Сэдэв '+t.number+': '+t.title}`;$('topicSub').textContent=`${t.number===23?'22 сэдвийн бүх асуулт холилдсон':'Нийт '+n+' энгийн тест'} | Интерактив систем`;$('selectorTitle').textContent=`ТЕСТ СОНГОГЧ (1–${n})`;$('qtag').textContent=`ТЕСТ № ${qi+1}`;$('question').textContent=`${qi+1}. ${item.text}`;$('answered').textContent=`${sc.done} / ${n}`;$('score').textContent=`${sc.correct} / ${sc.done}`;let pct=sc.done?Math.round(sc.correct/sc.done*100):0;$('progressPct').textContent=pct+'%';$('progressBar').style.width=(sc.done/n*100)+'%';$('navcount').innerHTML=`Асуулт <b>${qi+1}</b> / ${n}`;$('prev').disabled=qi===0;$('next').textContent=qi===n-1?'Дуусгах / Эх рүү →':'Дараах →';$('revealText').textContent=reveal?'Идэвхтэй':'Унтраалттай';$('revealBtn').classList.toggle('on',reveal);
let opts=$('options');opts.innerHTML='';item.options.forEach(o=>{let b=document.createElement('button');b.className='option';if(s.pick===o.letter)b.classList.add('selected');if((s.checked&&feedbackVisible)||reveal){if(o.letter===item.answer)b.classList.add('correct');else if(s.checked&&feedbackVisible&&s.pick===o.letter)b.classList.add('incorrect');else if(s.checked&&feedbackVisible)b.classList.add('dim')}let l=document.createElement('span');l.className='letter';l.textContent=o.letter+'.';let tx=document.createElement('span');tx.textContent=o.text;b.append(l,tx);if(s.checked||reveal){let tag=document.createElement('span');tag.className='status';if(o.letter===item.answer)tag.textContent='✓ Зөв хариулт';else if(s.checked&&feedbackVisible&&s.pick===o.letter)tag.textContent='✕ Буруу';if(tag.textContent)b.append(tag)}b.disabled=s.checked;b.onclick=()=>choose(o.letter);opts.append(b)});
let f=$('feedback');f.className='feedback hidden';if(s.checked&&feedbackVisible){f.className='feedback '+(s.correct?'good':'bad');let selected=item.options.find(o=>o.letter===s.pick),correct=item.options.find(o=>o.letter===item.answer);f.innerHTML=`<b>${s.correct?'ЗӨВ ХАРИУЛЛАА!':'БУРУУ ХАРИУЛЛАА!'}</b><div class="why">${s.correct?'Таны сонгосон хариулт зөв байна.':'Таны сонгосон хариулт буруу байна.'}<br><b>Зөв хариулт: ${correct.letter}. ${escapeHtml(correct.text)}</b></div>`}else if(reveal){f.className='feedback good';f.textContent='Зөв хариулт: '+item.answer+'. '+item.options.find(o=>o.letter===item.answer).text}
if(!feedbackVisible&&!reveal){f.innerHTML='';f.className='feedback hidden'}renderGrid(); }
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(letter){if(st().checked)return;st().pick=letter;st().checked=true;st().correct=(letter===q().answer);feedbackVisible=true;render()}
function checkAnswer(){if(!st().pick){alert('Эхлээд хариултаа сонгоно уу.');return}feedbackVisible=true;st().checked=true;st().correct=st().pick===q().answer;render()}
function move(d){if(d===1&&qi===topic().questions.length-1){qi=0}else qi=Math.max(0,Math.min(topic().questions.length-1,qi+d));feedbackVisible=false;reveal=false;$('feedback').replaceChildren();$('feedback').className='feedback hidden';render()}
function renderGrid(){let el=$('gridnums');el.innerHTML='';S[ti].forEach((s,i)=>{if(filter==='answered'&&!s.checked||filter==='open'&&s.checked||filter==='wrong'&&!(s.checked&&!s.correct))return;let b=document.createElement('button');b.textContent=i+1;b.className=(i===qi?'current ':'')+(s.checked?(s.correct?'correct':'wrong'):'');b.onclick=()=>{
qi=i;
feedbackVisible=false;
reveal=false;
$('feedback').innerHTML='';

// Буруу хариулсан асуултыг дахин сонгох боломжтой болгоно.
// Зөв хариулсан асуултын үр дүн хэвээр хадгалагдана.
if(S[ti][i].checked && !S[ti][i].correct){
  S[ti][i].checked=false;
  S[ti][i].correct=false;
  S[ti][i].pick=null;
}
render()
};el.append(b)})}

function resetTopic(){$('resetModal').classList.remove('hidden')}
function cancelReset(){$('resetModal').classList.add('hidden')}
function confirmReset(){
  // Зөвхөн одоо сонгосон сэдвийн хариултын төлөвийг цэвэрлэнэ.
  S[ti].forEach(x=>{x.pick=null;x.checked=false;x.correct=false});
  qi=0;filter='all';feedbackVisible=false;reveal=false;

function challenge(){let unanswered=S[ti].findIndex(x=>!x.checked);if(unanswered>=0)qi=unanswered;else{alert('Энэ бүлгийн бүх асуултад хариулсан байна. Шинэчлэх товчоор дахин эхлүүлнэ үү.');return}render()}
function showKey(){let panel=$('keyPanel');let body=T[ti].questions.map((x,i)=>`<span style="display:inline-block;min-width:48px">${i+1}. <b style="color:#a7f3d0">${x.answer}</b></span>`).join('');$('keyHeading').textContent=`${topic().number===23?'Холимог тест':'Сэдэв '+topic().number} — Хариултын түлхүүр`;$('keyContent').innerHTML=body;panel.style.display='block';panel.scrollIntoView({behavior:'smooth',block:'nearest'})}
function hideKey(){$('keyPanel').style.display='none'}
const topicSelect=$('topicSelect');T.forEach((t,i)=>{let op=document.createElement('option');op.value=String(i);op.textContent=`${t.number===23?'ХОЛИМОГ ТЕСТ':'Сэдэв '+t.number+': '+t.title}`;topicSelect.append(op)});
